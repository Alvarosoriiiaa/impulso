<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impulso">
<meta name="theme-color" content="#1d2b3a">
<title>Impulso</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* El fondo de la página es el del tema: si iOS deja ver algo por detrás (rebote, barra de estado), no hay franjas negras */
html,body{height:100%;background:var(--page-bg,#1d2b3a);overscroll-behavior:none;overflow:hidden}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:root{--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--accent:#ff5a6e;--sheet:#f6f3ee;--sheet-text:#1c2026}

/* En el móvil la app ocupa toda la pantalla, de borde a borde (también bajo la barra de estado
   y la del botón de inicio). Solo en un ordenador con ratón se muestra como un teléfono centrado. */
#app{position:fixed;inset:0;overflow:hidden;color:var(--text);isolation:isolate}
@media (hover:hover) and (pointer:fine) and (min-width:600px) and (min-height:700px){
  html,body{background:#0b0d12}
  body{display:flex;justify-content:center;align-items:center}
  #app{position:relative;inset:auto;width:100%;max-width:440px;height:min(100dvh - 40px,900px);border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px #000}
}

.bg{position:absolute;inset:0;z-index:-2;transition:opacity .45s ease}
.bg .scrim{position:absolute;inset:0;background:#000}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.18;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.glass{background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(255,255,255,.22)}
.light .glass{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.12);-webkit-backdrop-filter:none;backdrop-filter:none}
.press{transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.press:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.press:active{transform:none;opacity:.7}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.card{content-visibility:auto;position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 30px 130px;text-align:center}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:20px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.label{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
.quote{font-family:var(--serif);font-weight:500;line-height:1.22;max-width:11em;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,var(--shadow))}
.author{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:var(--author);display:flex;align-items:center;gap:12px}
.author::before,.author::after{content:'';width:18px;height:1px;background:currentColor;opacity:.55}
.qmark{font-family:var(--serif);font-weight:600;font-size:86px;line-height:1;height:40px;overflow:visible;opacity:.32;margin-bottom:-8px}

/* Entrada suave de cada frase al llegar a ella */
.qwrap>*,.actions,.suggest{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.card.out .qwrap>*,.card.out .actions,.card.out .suggest{opacity:0;transform:translateY(16px)}
.qwrap>:nth-child(2){transition-delay:.05s}.qwrap>:nth-child(3){transition-delay:.1s}.qwrap>:nth-child(4){transition-delay:.15s}
.actions{transition-delay:.2s}.suggest{transition-delay:.25s}
.cbtn.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* Degradados suaves arriba y abajo para que las barras siempre se lean */
.edge{position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.edge.top{top:0;height:150px;background:linear-gradient(var(--edge),transparent)}
.edge.bottom{bottom:0;height:170px;background:linear-gradient(transparent,var(--edge))}

/* Pantalla de carga al abrir desde el icono */
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#132030;transition:opacity .5s ease}
#splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:breathe 1.4s ease-in-out infinite alternate}
#splash span{font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;color:#fbf8f2}
#splash.hide{opacity:0;pointer-events:none}
@keyframes breathe{from{transform:scale(.96)}to{transform:scale(1.03)}}
.large-author .author{font-size:14px;font-weight:700}
.actions{display:flex;gap:18px;margin-top:36px}
.cbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.cbtn.on{background:#fff;border-color:#fff;color:var(--accent)}
.cbtn.on svg{fill:var(--accent);stroke:var(--accent)}
.suggest{margin-top:22px;height:40px;padding:0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.suggest svg{width:17px;height:17px}
.bigheart{position:absolute;left:50%;top:44%;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 16px rgba(0,0,0,.25))}
.bigheart svg{width:100%;height:100%;fill:var(--accent)}
.bigheart.go{animation:heart .8s ease forwards}
@keyframes heart{0%{opacity:0;transform:scale(.4)}12%{opacity:1}38%{transform:scale(1.05)}45%{transform:scale(1)}69%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.hint{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--sub);transition:opacity .3s}
.hint svg{animation:bob .9s ease-in-out infinite alternate;width:20px;height:20px}
@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-6px)}}

/* Tarjeta del objetivo */
.goal-title{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.2;max-width:11em;text-shadow:0 2px 10px rgba(0,0,0,var(--shadow))}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{height:32px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;font-size:13px;font-weight:600}
.goal-q{font-size:16px;color:var(--sub);margin-top:4px}
.progress-btn{margin-top:26px;height:52px;padding:0 22px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.progress-btn.on{background:var(--text);color:var(--on-text);border-color:var(--text)}
.linkbtn{margin-top:12px;font-size:14px;font-weight:600;color:var(--sub);padding:8px}

/* Barras */
.topbar,.bottombar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:0 20px;z-index:5;pointer-events:none}
.topbar>*,.bottombar>*{pointer-events:auto}
.topbar{top:0;padding-top:calc(10px + env(safe-area-inset-top))}
.bottombar{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.logo{font-family:var(--serif);font-style:italic;font-weight:600;font-size:30px;margin-right:auto}
.streak{height:36px;padding:0 13px;border-radius:99px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.streak svg{width:16px;height:16px;fill:#ff9f43;stroke:#ff9f43}
.rbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.rbtn svg{width:17px;height:17px}
.pillbtn{height:50px;padding:0 20px 0 16px;border-radius:99px;display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;margin-right:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.pillbtn svg{width:18px;height:18px}
.pillbtn .chev{width:14px;height:14px;opacity:.6;margin-left:-2px}
.dock{display:flex;align-items:center;height:50px;border-radius:99px;padding:0 4px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.dock .sep{width:1px;height:22px;background:currentColor;opacity:.2}
.bbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.bbtn svg{width:20px;height:20px}
.bbtn.on svg{fill:currentColor}
.streak{cursor:pointer}

#toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px) scale(.96);opacity:0;background:rgba(20,22,28,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:11px 18px 11px 14px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;z-index:70;pointer-events:none;transition:all .35s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast svg{width:18px;height:18px}
#toast svg.fill{fill:var(--accent);stroke:var(--accent)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* Hojas */
/* Las hojas van por encima del cuestionario (z-index 40) para que la guía del widget se pueda abrir desde él */
.overlay{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.overlay.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;display:flex;flex-direction:column;background:var(--sheet);color:var(--sheet-text);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet.tall{height:88%}
.grabber{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);margin:8px auto 4px;flex:none}
.sheet-body{overflow-y:auto;padding:12px 22px 32px;-webkit-overflow-scrolling:touch}
.sh-title{font-size:26px;font-weight:700}
.sh-sub{font-size:15px;color:rgba(28,32,38,.62);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.sheet-close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.07);display:grid;place-items:center;z-index:2}
.sheet-close svg{width:15px;height:15px;stroke-width:2.4}
.cat{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:20px;padding:16px;min-height:128px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 10px rgba(28,32,38,.05)}
.cat.on{border:2px solid var(--sheet-text);padding:15px}
.cat-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:8px}
.cat-ic svg{width:18px;height:18px}
.thumb .sw .ok{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;color:#1c2026;display:none;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.thumb .sw .ok svg{width:13px;height:13px;stroke-width:3}
.thumb.on .sw .ok{display:grid}
.cat b{font-size:17px}
.cat span{font-size:14px;color:rgba(28,32,38,.62)}
.cat small{margin-top:auto;font-size:12px;font-weight:600;color:rgba(28,32,38,.62);padding-top:12px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.thumb .sw{position:relative;width:100%;height:150px;border-radius:16px;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(0,0,0,.08)}
.thumb .sw span{font-family:var(--serif);font-weight:600;font-size:30px;position:relative}
.thumb.on{font-weight:700}
.thumb.on .sw{border:2.5px solid currentColor}
.redo{margin-top:24px;width:100%;height:50px;border-radius:99px;border:1px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.redo svg{width:18px;height:18px}
.note{font-size:13px;color:rgba(28,32,38,.62);margin-top:10px;text-align:center}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;width:100%;text-align:left}
.row svg{width:20px;height:20px;flex:none}
.row .chev{margin-left:auto;opacity:.4}
.prow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:13px 16px;margin-top:10px;width:100%;text-align:left;box-shadow:0 1px 6px rgba(28,32,38,.04)}
.prow>svg{width:20px;height:20px;flex:none;opacity:.75}
.prow .t{flex:1;min-width:0}
.prow .k{display:block;font-size:12px;font-weight:600;color:rgba(28,32,38,.55);text-transform:uppercase;letter-spacing:.06em}
.prow .v{display:block;font-size:15px;font-weight:500;margin-top:2px;line-height:1.3}
.prow .v.empty{color:rgba(28,32,38,.42)}
.prow .edit{font-size:14px;font-weight:600;color:#c2394e}
.codebox{margin-top:12px;background:#1c2026;color:#e8e6e1;border-radius:14px;padding:14px;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:120px;overflow:auto;white-space:pre}
.copybtn{margin-top:10px;width:100%;height:48px;border-radius:99px;border:1.5px solid var(--sheet-text);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700}
.copybtn svg{width:18px;height:18px}
.ext{color:#c2394e;font-weight:600;text-decoration:none}
.section-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(28,32,38,.55);margin-top:26px}
.seg{display:flex;background:rgba(0,0,0,.07);border-radius:10px;padding:2px;margin-top:18px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.steps{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;font-size:15px;line-height:1.4}
.steps li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sheet-text);color:var(--sheet);font-style:normal;font-weight:700;font-size:14px;display:grid;place-items:center}
.darkbtn{margin-top:22px;width:100%;height:54px;border-radius:99px;background:var(--sheet-text);color:var(--sheet);font-size:17px;font-weight:700}

/* Vista previa del móvil */
.phone{position:relative;width:230px;height:300px;margin:22px auto 4px;border-radius:36px;overflow:hidden;border:7px solid #111;background:linear-gradient(#24324f,#5d4a74,#c98478);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center}
.phone .island{position:absolute;top:8px;left:50%;width:70px;height:20px;margin-left:-35px;background:#000;border-radius:99px}
.phone .date{margin-top:44px;font-size:13px;font-weight:600}
.sh-title{padding-right:40px}
.phone .time{font-size:58px;font-weight:700;line-height:1.05;font-family:-apple-system,'SF Pro Rounded',system-ui,sans-serif;letter-spacing:-1px}
.phone .lw{width:166px;text-align:left;margin-top:6px;font-size:12px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.phone .lw small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.phone .hw{position:relative;margin-top:44px;width:190px;height:90px;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:10px}
.phone .hw p{position:relative;font-family:var(--serif);font-size:13.5px;line-height:1.2}
.phone .icons{display:grid;grid-template-columns:repeat(4,38px);gap:13px;margin-top:14px}
.phone .icons i{height:38px;border-radius:10px;background:rgba(255,255,255,.28)}

/* Cuestionario */
#onb{background:var(--bgfull)}
#onb{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;padding:0 22px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);transition:opacity .35s}
#onb.hide{opacity:0;pointer-events:none}
.onb-head{height:56px;display:flex;align-items:center;gap:14px;flex:none}
.onb-head .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.onb-head .back svg{width:18px;height:18px}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.light .bar{background:rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:var(--text);transition:width .3s}
.onb-body{flex:1;overflow-y:auto;padding:16px 0 24px;scrollbar-width:none}
.onb-body::-webkit-scrollbar{display:none}
.onb-body.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.onb-body.enter-back{animation:enterback .4s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes enterback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.onb-foot{flex:none;padding:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.q-title{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.12}
.q-sub{font-size:16px;color:var(--sub);margin-top:10px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;text-align:left;width:100%}
.opt.on{box-shadow:inset 0 0 0 2px var(--text);background:rgba(255,255,255,.2)}
.light .opt.on{background:rgba(0,0,0,.1)}
.opt .ic svg{width:20px;height:20px}
.opt .tx{flex:1}
.opt .tx b{display:block;font-size:16px;font-weight:600}
.opt .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center}
.opt.multi .mk{border-radius:6px}
.opt.on .mk{background:var(--text);border-color:var(--text);color:var(--on-text)}
.opt .mk svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .mk svg{opacity:1}
.field{width:100%;margin-top:22px;padding:16px 20px;border-radius:18px;font-size:18px;font-weight:500;outline:none;resize:none}
.field::placeholder{color:var(--sub)}
.hz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hz button{height:46px;border-radius:99px;font-size:15px;font-weight:600}
.hz button.on{background:var(--text);color:var(--on-text);border-color:var(--text)}
.primary{height:54px;border-radius:99px;background:var(--text);color:var(--on-text);font-size:17px;font-weight:700;width:100%}
.primary:disabled{opacity:.4}
.secondary{height:40px;font-size:15px;font-weight:600;color:var(--sub);width:100%}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:60px}
.welcome .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:60px;line-height:1}
.welcome .lead{font-family:var(--serif);font-size:29px;line-height:1.15}
.welcome p{font-size:16px;color:var(--sub);line-height:1.45}
.welcome small{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
.welcome small svg{width:14px;height:14px}
.sum{display:flex;gap:14px;padding:16px;border-radius:18px;margin-top:12px;align-items:flex-start}
.sum svg{width:20px;height:20px;flex:none;margin-top:2px}
.sum small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.sum p{font-size:16px;font-weight:500;margin-top:4px;line-height:1.35}

<script>

const QUOTES = ([{"cat":"motivacion","text":"Nadie va a venir a hacerlo por ti. Levántate."},{"cat":"motivacion","text":"Deja de esperar el momento perfecto. Este es el momento."},{"cat":"motivacion","text":"Hazlo con miedo, pero hazlo."},{"cat":"motivacion","text":"Tu vida cambia el día que decides que ya basta."},{"cat":"motivacion","text":"No te pidas motivación. Pídete un primer paso."},{"cat":"motivacion","text":"Hoy no se negocia: hoy se hace."},{"cat":"motivacion","text":"Nadie recuerda lo que costó. Todos ven lo que lograste."},{"cat":"motivacion","text":"Si fuera fácil, cualquiera lo haría. Por eso merece la pena."},{"cat":"motivacion","text":"Empieza torpe. Ya mejorarás por el camino."},{"cat":"motivacion","text":"Tus excusas no te van a llevar a ningún sitio."},{"cat":"motivacion","text":"Lo que no empiezas hoy, mañana te pesa el doble."},{"cat":"motivacion","text":"Ponte en marcha. La claridad llega caminando."},{"cat":"motivacion","text":"Un paso hoy vale más que cien planes para mañana."},{"cat":"motivacion","text":"No has llegado hasta aquí para quedarte aquí."},{"cat":"motivacion","text":"Dentro de un año desearás haber empezado hoy."},{"cat":"motivacion","text":"Cada mañana te regala la oportunidad de ser quien quieres ser."},{"cat":"motivacion","text":"La vida no se pausa mientras dudas."},{"cat":"motivacion","text":"Lo que haces a diario dice más de ti que lo que sueñas."},{"cat":"motivacion","text":"Un día te alegrarás de no haberte rendido justo hoy."},{"cat":"motivacion","text":"Lo que hoy es esfuerzo, mañana será tu historia."},{"cat":"motivacion","text":"El mejor momento de tu vida puede estar a una decisión de distancia."},{"cat":"motivacion","text":"A veces el valor es simplemente volver a intentarlo."},{"cat":"motivacion","text":"Lo estás haciendo mejor de lo que crees."},{"cat":"motivacion","text":"Mírate: has superado todos tus días difíciles hasta hoy."},{"cat":"motivacion","text":"Tienes más fuerza de la que te imaginas."},{"cat":"motivacion","text":"No hace falta que lo tengas todo claro. Basta con seguir."},{"cat":"motivacion","text":"Hoy puede ser un buen día. Dale una oportunidad."},{"cat":"motivacion","text":"Cree en ti aunque todavía no veas el resultado."},{"cat":"motivacion","text":"Paso a paso también se llega muy lejos."},{"cat":"motivacion","text":"Eres capaz de cosas que aún no has probado."},{"cat":"motivacion","text":"Cada intento cuenta, aunque nadie lo aplauda."},{"cat":"motivacion","text":"Sonríe: hoy tienes otra oportunidad."},{"cat":"motivacion","text":"El día de hoy todavía puede salir bien."},{"cat":"motivacion","text":"Si te da vértigo, probablemente vas por buen camino."},{"cat":"motivacion","text":"Vas más lejos de lo que piensas, aunque vayas despacio."},{"cat":"motivacion","text":"Ninguna montaña se sube mirándola desde abajo."},{"cat":"motivacion","text":"Que tu prisa por llegar no te robe las ganas de avanzar."},{"cat":"motivacion","text":"Hoy es un buen día para demostrarte de qué estás hecho."},{"cat":"motivacion","text":"El viaje de mil millas comienza con un solo paso.","author":"Lao Tse"},{"cat":"motivacion","text":"No importa lo despacio que vayas, siempre que no te detengas.","author":"Confucio"},{"cat":"motivacion","text":"Quien ha empezado ya tiene hecha la mitad. Atrévete a saber.","author":"Horacio"},{"cat":"motivacion","text":"No nos atrevemos a muchas cosas porque son difíciles; son difíciles porque no nos atrevemos.","author":"Séneca"},{"cat":"motivacion","text":"Nada grande se ha logrado jamás sin entusiasmo.","author":"Ralph Waldo Emerson"},{"cat":"motivacion","text":"Si uno avanza con confianza en la dirección de sus sueños, encontrará un éxito inesperado.","author":"Henry David Thoreau"},{"cat":"motivacion","text":"Caminante, no hay camino, se hace camino al andar.","author":"Antonio Machado"},{"cat":"motivacion","text":"Sé paciente y resiste: algún día este dolor te será útil.","author":"Ovidio"},{"cat":"amor","text":"Deja de pedirte perdón por existir."},{"cat":"amor","text":"No te conformes con migajas. Ni de los demás ni de ti."},{"cat":"amor","text":"Tu paz vale más que tener razón."},{"cat":"amor","text":"Aléjate de lo que te hace sentir pequeño."},{"cat":"amor","text":"Di que no sin dar mil explicaciones."},{"cat":"amor","text":"Eres tu relación más larga. Cuídala."},{"cat":"amor","text":"No eres una opción. No te trates como una."},{"cat":"amor","text":"Deja de compararte: nadie más está viviendo tu vida."},{"cat":"amor","text":"Ponerte primero a veces es la única forma de seguir dando."},{"cat":"amor","text":"Si no te gusta cómo te hablas, cambia la conversación."},{"cat":"amor","text":"Quererte no es creerte perfecto; es estar de tu lado."},{"cat":"amor","text":"Todo lo que has vivido te ha hecho más sabio, no menos valioso."},{"cat":"amor","text":"Las heridas también enseñan dónde eres fuerte."},{"cat":"amor","text":"Un día te darás las gracias por no haberte abandonado."},{"cat":"amor","text":"Eres mucho más que tu peor momento."},{"cat":"amor","text":"Tu historia tiene capítulos difíciles, no un final escrito."},{"cat":"amor","text":"Lo que piensas de ti acaba siendo el techo de lo que intentas."},{"cat":"amor","text":"Aprender a estar contigo es aprender a estar bien en cualquier sitio."},{"cat":"amor","text":"Eres suficiente, hoy y tal como estás."},{"cat":"amor","text":"Date el cariño que regalas a todo el mundo."},{"cat":"amor","text":"Está bien no estar bien. Mañana será otro día."},{"cat":"amor","text":"Mereces descansar sin sentir culpa."},{"cat":"amor","text":"Tu sensibilidad es un regalo, no un defecto."},{"cat":"amor","text":"Hay personas que se alegran de que existas. Tú también deberías."},{"cat":"amor","text":"Mírate con más ternura. Lo estás intentando."},{"cat":"amor","text":"No tienes que demostrar nada para merecer cariño."},{"cat":"amor","text":"Abrázate fuerte: has llegado hasta aquí."},{"cat":"amor","text":"Ir despacio también es avanzar."},{"cat":"amor","text":"Tus errores no te definen; te enseñan."},{"cat":"amor","text":"Celebra cada pequeña victoria. Son tuyas."},{"cat":"amor","text":"Tu cuerpo te ha sostenido todos estos años. Trátalo con cariño."},{"cat":"amor","text":"Hoy, sé tu propio lugar seguro."},{"cat":"amor","text":"Brillas más cuando dejas de esconderte."},{"cat":"amor","text":"Tienes derecho a cambiar, a crecer y a empezar de nuevo."},{"cat":"amor","text":"Nadie puede ser tú mejor que tú."},{"cat":"amor","text":"Perdónate. Ya has cargado bastante con eso."},{"cat":"amor","text":"Vales lo mismo en tus días buenos que en los malos."},{"cat":"amor","text":"Hay belleza en tu forma de levantarte."},{"cat":"amor","text":"Conocerse a uno mismo es el principio de toda sabiduría.","author":"Aristóteles"},{"cat":"amor","text":"La amistad es un alma que habita en dos cuerpos.","author":"Aristóteles"},{"cat":"amor","text":"Lo que no quieras para ti, no lo hagas a los demás.","author":"Confucio"},{"cat":"amor","text":"Quien conoce a los demás es sabio; quien se conoce a sí mismo está iluminado.","author":"Lao Tse"},{"cat":"amor","text":"Una vida sin examen no merece ser vivida.","author":"Sócrates"},{"cat":"amor","text":"¿Qué he avanzado? He empezado a ser amigo de mí mismo.","author":"Séneca"},{"cat":"disciplina","text":"La motivación se va. La disciplina se queda."},{"cat":"disciplina","text":"No tienes que tener ganas. Tienes que tener un plan."},{"cat":"disciplina","text":"Haz lo difícil primero y el resto del día será tuyo."},{"cat":"disciplina","text":"Cumple contigo como cumplirías con los demás."},{"cat":"disciplina","text":"Menos excusas, más repeticiones."},{"cat":"disciplina","text":"Si no lo apuntas en tu agenda, no existe."},{"cat":"disciplina","text":"Tu futuro se construye en las mañanas que no te apetece."},{"cat":"disciplina","text":"Lo que haces cuando nadie te mira es lo que te define."},{"cat":"disciplina","text":"Puedes fallar un día. Nunca dos seguidos."},{"cat":"disciplina","text":"Disciplina es elegir lo que quieres de verdad por encima de lo que quieres ahora."},{"cat":"disciplina","text":"Apaga el móvil. Enciende tu vida."},{"cat":"disciplina","text":"Hoy toca. Sin dramas."},{"cat":"disciplina","text":"Las ganas no son un requisito."},{"cat":"disciplina","text":"Termina lo que empiezas."},{"cat":"disciplina","text":"Cada hábito es una pequeña promesa que te haces a ti mismo."},{"cat":"disciplina","text":"La libertad está al otro lado de la constancia."},{"cat":"disciplina","text":"Repetir lo pequeño es lo que hace grande el resultado."},{"cat":"disciplina","text":"Quien gana sus mañanas, gana su vida."},{"cat":"disciplina","text":"La constancia convierte lo imposible en rutina."},{"cat":"disciplina","text":"Ser disciplinado es quererte a largo plazo."},{"cat":"disciplina","text":"Los resultados que admiras se hicieron en días aburridos."},{"cat":"disciplina","text":"El esfuerzo silencioso acaba haciendo mucho ruido."},{"cat":"disciplina","text":"No hace falta ser perfecto, solo constante."},{"cat":"disciplina","text":"Si hoy fallaste, mañana vuelves. Eso también es disciplina."},{"cat":"disciplina","text":"Cinco minutos también cuentan."},{"cat":"disciplina","text":"Un poco cada día. Así se llega."},{"cat":"disciplina","text":"Celebra que hoy has cumplido, aunque haya sido poco."},{"cat":"disciplina","text":"Hoy siembras. Mañana lo agradecerás."},{"cat":"disciplina","text":"Sé paciente: las raíces crecen antes que las flores."},{"cat":"disciplina","text":"Volver a empezar no es fracasar; es no rendirse."},{"cat":"disciplina","text":"Ordena tu día y tu mente te seguirá."},{"cat":"disciplina","text":"Haz que lo correcto sea lo fácil."},{"cat":"disciplina","text":"Prepárate la noche antes y la mañana será más ligera."},{"cat":"disciplina","text":"Una tarea a la vez, con todo tu foco."},{"cat":"disciplina","text":"El progreso no siempre se ve, pero siempre se acumula."},{"cat":"disciplina","text":"Tu rutina es el idioma en el que le hablas a tus sueños."},{"cat":"disciplina","text":"Lo que repites cada día acaba siendo quien eres."},{"cat":"disciplina","text":"Cuando dudes entre empezar o posponer, empieza."},{"cat":"disciplina","text":"Ningún hombre es libre si no es dueño de sí mismo.","author":"Epicteto"},{"cat":"disciplina","text":"No es que tengamos poco tiempo, sino que perdemos mucho.","author":"Séneca"},{"cat":"disciplina","text":"Gota a gota se horada la piedra.","author":"Ovidio"},{"cat":"disciplina","text":"La primera y mejor de las victorias es vencerse a uno mismo.","author":"Platón"},{"cat":"disciplina","text":"Lo que hay que aprender a hacer, lo aprendemos haciéndolo.","author":"Aristóteles"},{"cat":"disciplina","text":"Exígete mucho a ti mismo y espera poco de los demás.","author":"Confucio"},{"cat":"disciplina","text":"Ninguna gran cosa se crea de repente.","author":"Epicteto"},{"cat":"disciplina","text":"Quien está en todas partes no está en ninguna.","author":"Séneca"},{"cat":"disciplina","text":"El carácter de una persona es su destino.","author":"Heráclito"},{"cat":"calma","text":"Respira. No todo es urgente."},{"cat":"calma","text":"Suelta lo que no puedes controlar."},{"cat":"calma","text":"No tienes que responder ahora."},{"cat":"calma","text":"Baja el ritmo. La vida no es una carrera."},{"cat":"calma","text":"Desconecta para volver a conectar contigo."},{"cat":"calma","text":"No te lleves a la cama los problemas de hoy."},{"cat":"calma","text":"Hoy, menos ruido y más paz."},{"cat":"calma","text":"Deja de pelearte con lo que ya pasó."},{"cat":"calma","text":"No todo merece tu energía."},{"cat":"calma","text":"Afloja los hombros. Respira hondo. Sigue."},{"cat":"calma","text":"Todo pasa, lo bueno y lo malo. Por eso hay que vivirlo."},{"cat":"calma","text":"La calma también es una forma de fuerza."},{"cat":"calma","text":"Lo que es para ti no necesita que lo persigas con ansiedad."},{"cat":"calma","text":"El silencio responde muchas preguntas."},{"cat":"calma","text":"No eres tus pensamientos; eres quien los mira pasar."},{"cat":"calma","text":"Las tormentas no duran para siempre. Tampoco esta."},{"cat":"calma","text":"La paz no llega cuando todo se arregla, sino cuando dejas de forzarlo."},{"cat":"calma","text":"Hay cosas que solo se entienden con el tiempo."},{"cat":"calma","text":"Mañana lo verás todo con otros ojos."},{"cat":"calma","text":"Date permiso para parar un rato."},{"cat":"calma","text":"Esta noche, descansa. Ya has hecho suficiente."},{"cat":"calma","text":"Tranquilo: no tienes que tenerlo todo resuelto."},{"cat":"calma","text":"Una respiración lenta y vuelves a estar aquí."},{"cat":"calma","text":"Está bien ir a tu ritmo."},{"cat":"calma","text":"Lo que hoy te preocupa, mañana será una anécdota."},{"cat":"calma","text":"Mira el cielo un minuto. Todo sigue en su sitio."},{"cat":"calma","text":"Haz una cosa a la vez y hazla con cariño."},{"cat":"calma","text":"Ten paciencia contigo. Estás aprendiendo."},{"cat":"calma","text":"Descansar no es perder el tiempo."},{"cat":"calma","text":"Abraza el momento: es el único que tienes."},{"cat":"calma","text":"Camina sin prisa. El camino también es la vida."},{"cat":"calma","text":"Que nada te quite la paz que tanto te costó encontrar."},{"cat":"calma","text":"Bebe agua, respira y vuelve a intentarlo."},{"cat":"calma","text":"El mar no se pelea con sus olas."},{"cat":"calma","text":"Elige la paz, aunque tengas razón."},{"cat":"calma","text":"Deja que hoy sea suficiente."},{"cat":"calma","text":"Cierra los ojos, cuenta hasta diez y vuelve a empezar."},{"cat":"calma","text":"La tranquilidad se entrena como cualquier otra cosa."},{"cat":"calma","text":"Sufrimos más en la imaginación que en la realidad.","author":"Séneca"},{"cat":"calma","text":"La naturaleza no tiene prisa y, sin embargo, todo se cumple.","author":"Lao Tse"},{"cat":"calma","text":"En ningún lugar puede retirarse una persona con más tranquilidad que en su propia alma.","author":"Marco Aurelio"},{"cat":"calma","text":"Limítate al momento presente.","author":"Marco Aurelio"},{"cat":"calma","text":"Nadie se baña dos veces en el mismo río.","author":"Heráclito"},{"cat":"calma","text":"Nada en el mundo es más blando que el agua y, sin embargo, nada la supera ante lo duro.","author":"Lao Tse"},{"cat":"calma","text":"Quien sabe que tiene bastante es rico.","author":"Lao Tse"},{"cat":"calma","text":"Aprovecha el día y confía lo menos posible en el mañana.","author":"Horacio"},{"cat":"calma","text":"Todo lo que ha de venir es incierto: vive ya.","author":"Séneca"},{"cat":"calma","text":"La ira es una locura breve.","author":"Horacio"},{"cat":"exito","text":"El éxito no es suerte. Es trabajo que nadie vio."},{"cat":"exito","text":"Deja de esperar a que te elijan. Elígete."},{"cat":"exito","text":"Haz que tu trabajo hable por ti."},{"cat":"exito","text":"Si quieres resultados distintos, haz cosas distintas."},{"cat":"exito","text":"Tu red de contactos empieza por ser alguien de fiar."},{"cat":"exito","text":"No pidas permiso para ser ambicioso."},{"cat":"exito","text":"Las oportunidades no llegan: se construyen."},{"cat":"exito","text":"Equivócate rápido y aprende más rápido."},{"cat":"exito","text":"Elige pocas cosas y hazlas muy bien."},{"cat":"exito","text":"Rodéate de gente que te haga subir el listón."},{"cat":"exito","text":"Aprende algo nuevo cada semana."},{"cat":"exito","text":"Invierte en ti: es lo único que nadie te puede quitar."},{"cat":"exito","text":"El éxito de verdad es poder mirarte al espejo con orgullo."},{"cat":"exito","text":"Ningún logro vale si pierdes a quien eres por el camino."},{"cat":"exito","text":"Los fracasos son la parte de la historia que nadie cuenta."},{"cat":"exito","text":"Cada experto fue un día un principiante que no se rindió."},{"cat":"exito","text":"La paciencia también es una estrategia."},{"cat":"exito","text":"Define tu éxito antes de que otros lo hagan por ti."},{"cat":"exito","text":"Crecer duele un poco. Quedarse igual duele más."},{"cat":"exito","text":"Lo que construyes despacio dura más."},{"cat":"exito","text":"El talento abre puertas; el carácter las mantiene abiertas."},{"cat":"exito","text":"Detrás de cada logro hay mil intentos que no salen en la foto."},{"cat":"exito","text":"Tu momento está llegando. Sigue preparándote."},{"cat":"exito","text":"Celebra tus avances, no solo tus metas."},{"cat":"exito","text":"Lo que hoy parece pequeño puede ser el principio de algo grande."},{"cat":"exito","text":"Confía en el proceso, incluso cuando no se vea."},{"cat":"exito","text":"Cada no te acerca un poco más a tu sí."},{"cat":"exito","text":"Mereces lo que estás construyendo."},{"cat":"exito","text":"Nunca es tarde para perseguir lo que quieres."},{"cat":"exito","text":"Tu ritmo es el correcto si no te detienes."},{"cat":"exito","text":"Hoy das un paso más hacia la vida que imaginas."},{"cat":"exito","text":"Cuida los detalles: ahí empieza la excelencia."},{"cat":"exito","text":"Pide ayuda: nadie llega lejos solo."},{"cat":"exito","text":"Las ideas valen poco hasta que alguien las hace realidad. Que ese alguien seas tú."},{"cat":"exito","text":"Tu historia aún tiene sus mejores capítulos por escribir."},{"cat":"exito","text":"La suerte suele encontrar a quien sigue trabajando."},{"cat":"exito","text":"Aprende de quien va delante y ayuda a quien viene detrás."},{"cat":"exito","text":"El día que dejes de compararte, empezarás a avanzar de verdad."},{"cat":"exito","text":"Las grandes cosas no se hacen por impulso, sino por una serie de pequeñas cosas reunidas.","author":"Vincent van Gogh"},{"cat":"exito","text":"No hay viento favorable para quien no sabe a qué puerto se dirige.","author":"Séneca"},{"cat":"exito","text":"Una golondrina no hace verano, ni tampoco un solo día.","author":"Aristóteles"},{"cat":"exito","text":"Equivocarse y no corregirse: ese es el verdadero error.","author":"Confucio"},{"cat":"exito","text":"Aprender sin pensar es inútil; pensar sin aprender, peligroso.","author":"Confucio"},{"cat":"exito","text":"Cada uno es artífice de su ventura.","author":"Miguel de Cervantes"},{"cat":"exito","text":"El que lee mucho y anda mucho, ve mucho y sabe mucho.","author":"Miguel de Cervantes"},{"cat":"exito","text":"Lo bueno, si breve, dos veces bueno.","author":"Baltasar Gracián"},{"cat":"exito","text":"Escribe en tu corazón que cada día es el mejor del año.","author":"Ralph Waldo Emerson"},{"cat":"exito","text":"Mientras enseñamos, aprendemos.","author":"Séneca"},{"cat":"exito","text":"El árbol que apenas se abarca con los brazos nació de un brote diminuto.","author":"Lao Tse"},{"cat":"exito","text":"Es mala la decisión que no puede cambiarse.","author":"Publilio Siro"},{"cat":"estoicismo","text":"Distingue lo que depende de ti de lo que no. Y actúa en consecuencia."},{"cat":"estoicismo","text":"Tu reacción es lo único que siempre te pertenece."},{"cat":"estoicismo","text":"El obstáculo de hoy es el entrenamiento de mañana."},{"cat":"estoicismo","text":"Recuerda que todo es prestado. Disfrútalo sin aferrarte."},{"cat":"estoicismo","text":"Imagina lo peor con calma y vivirás con menos miedo."},{"cat":"estoicismo","text":"Domina tus impulsos o ellos te dominarán a ti."},{"cat":"estoicismo","text":"Quejarte no cambia los hechos. Actuar, a veces sí."},{"cat":"estoicismo","text":"La virtud no necesita público."},{"cat":"estoicismo","text":"Haz lo que debes, pase lo que pase."},{"cat":"estoicismo","text":"Lo que hacen los demás es asunto suyo. Cómo respondes, asunto tuyo."},{"cat":"estoicismo","text":"Recuerda que vas a morir, y vive con más intención el tiempo que te queda."},{"cat":"estoicismo","text":"Nadie puede quitarte la paz si no se la entregas."},{"cat":"estoicismo","text":"Desear menos también es una forma de ser rico."},{"cat":"estoicismo","text":"La adversidad no te define. Tu respuesta, sí."},{"cat":"estoicismo","text":"Ninguna suerte es tan mala que un ánimo sereno no pueda sacar algo de ella."},{"cat":"estoicismo","text":"Tienes poder sobre tu mente, no sobre los acontecimientos. Date cuenta y encontrarás la fuerza.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No son las cosas las que nos perturban, sino la opinión que tenemos de ellas.","author":"Epicteto"},{"cat":"estoicismo","text":"La felicidad de tu vida depende de la calidad de tus pensamientos.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Mientras esperamos vivir, la vida pasa.","author":"Séneca"},{"cat":"estoicismo","text":"Lo que se interpone en el camino se convierte en el camino.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Primero di qué quieres ser; después haz lo que tengas que hacer.","author":"Epicteto"},{"cat":"estoicismo","text":"No pierdas más tiempo discutiendo cómo debe ser una buena persona. Sé una.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Se necesita muy poco para vivir una vida feliz.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"La mejor manera de vengarse es no parecerse a quien te hizo daño.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Por la mañana, cuando te cueste levantarte, piensa: me levanto para hacer el trabajo de un ser humano.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"El alma se tiñe del color de sus pensamientos.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Si no es correcto, no lo hagas; si no es verdad, no lo digas.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"A nadie le sucede nada que no esté hecho por naturaleza para soportar.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Mira hacia dentro: dentro está la fuente del bien.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Haz cada acto de tu vida como si fuera el último.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No vivas como si fueras a vivir diez mil años.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No pidas que las cosas sucedan como quieres; quiere que sucedan como suceden, y vivirás en paz.","author":"Epicteto"},{"cat":"estoicismo","text":"Unas cosas dependen de nosotros y otras no.","author":"Epicteto"},{"cat":"estoicismo","text":"Es imposible aprender lo que uno cree que ya sabe.","author":"Epicteto"},{"cat":"estoicismo","text":"Son las dificultades las que muestran quiénes somos.","author":"Epicteto"},{"cat":"estoicismo","text":"Si quieres progresar, acepta parecer ignorante en las cosas externas.","author":"Epicteto"},{"cat":"estoicismo","text":"Tenemos dos orejas y una sola boca para escuchar más y hablar menos.","author":"Zenón de Citio"},{"cat":"estoicismo","text":"La vida, si sabes usarla, es larga.","author":"Séneca"},{"cat":"estoicismo","text":"Apresúrate a vivir bien y piensa que cada día es una vida entera.","author":"Séneca"},{"cat":"estoicismo","text":"No es pobre quien tiene poco, sino quien desea más.","author":"Séneca"},{"cat":"estoicismo","text":"A veces, incluso vivir es un acto de valentía.","author":"Séneca"},{"cat":"estoicismo","text":"Hay que aprender a vivir durante toda la vida.","author":"Séneca"},{"cat":"estoicismo","text":"El camino de los preceptos es largo; el de los ejemplos, breve y eficaz.","author":"Séneca"},{"cat":"fe","text":"Dios no llega tarde. Llega a su tiempo."},{"cat":"fe","text":"Cuando no entiendas el camino, confía en quien lo traza."},{"cat":"fe","text":"Hoy no estás solo. Nunca lo has estado."},{"cat":"fe","text":"Pon en manos de Dios lo que tú no puedes cargar."},{"cat":"fe","text":"La fe no quita la tormenta, pero te da paz en medio de ella."},{"cat":"fe","text":"Da gracias a Dios por lo que tienes antes de pedirle lo que te falta."},{"cat":"fe","text":"Hay días en que la oración es la única fuerza que queda. Y basta."},{"cat":"fe","text":"Dios ve el esfuerzo que nadie más ve."},{"cat":"fe","text":"Si Dios te ha traído hasta aquí, no te va a soltar ahora."},{"cat":"fe","text":"Empieza el día dando gracias. Lo demás llega."},{"cat":"fe","text":"Tu valor no lo decide el mundo. Ya lo decidió Dios."},{"cat":"fe","text":"Lo que para ti es un final, para Dios puede ser un comienzo."},{"cat":"fe","text":"Dios escribe recto con renglones torcidos."},{"cat":"fe","text":"Reza, confía y da el siguiente paso."},{"cat":"fe","text":"Todo lo puedo en Cristo que me fortalece.","author":"Filipenses 4:13"},{"cat":"fe","text":"El Señor es mi pastor; nada me faltará.","author":"Salmo 23:1"},{"cat":"fe","text":"Aunque camine por valle de sombra de muerte, no temeré mal alguno, porque tú estás conmigo.","author":"Salmo 23:4"},{"cat":"fe","text":"Esfuérzate y sé valiente; no temas ni desmayes, porque el Señor tu Dios estará contigo dondequiera que vayas.","author":"Josué 1:9"},{"cat":"fe","text":"Venid a mí todos los que estáis cansados y agobiados, y yo os haré descansar.","author":"Mateo 11:28"},{"cat":"fe","text":"No temas, porque yo estoy contigo; no te angusties, porque yo soy tu Dios.","author":"Isaías 41:10"},{"cat":"fe","text":"Los que esperan en el Señor renovarán sus fuerzas; levantarán alas como las águilas.","author":"Isaías 40:31"},{"cat":"fe","text":"Él da fuerzas al cansado y multiplica el vigor del que no tiene ninguno.","author":"Isaías 40:29"},{"cat":"fe","text":"Echa sobre el Señor tu carga, y él te sostendrá.","author":"Salmo 55:22"},{"cat":"fe","text":"Sabemos que todas las cosas ayudan a bien a los que aman a Dios.","author":"Romanos 8:28"},{"cat":"fe","text":"Si Dios está con nosotros, ¿quién contra nosotros?","author":"Romanos 8:31"},{"cat":"fe","text":"El amor es paciente, es bondadoso. Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta.","author":"1 Corintios 13:4-7"},{"cat":"fe","text":"Por la noche durará el llanto, pero a la mañana vendrá la alegría.","author":"Salmo 30:5"},{"cat":"fe","text":"Encomienda al Señor tu camino, confía en él, y él actuará.","author":"Salmo 37:5"},{"cat":"fe","text":"Confía en el Señor con todo tu corazón, y no te apoyes en tu propia prudencia.","author":"Proverbios 3:5"},{"cat":"fe","text":"No os preocupéis por el día de mañana, porque el mañana traerá su propia preocupación.","author":"Mateo 6:34"},{"cat":"fe","text":"Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá.","author":"Mateo 7:7"},{"cat":"fe","text":"Estad quietos, y sabed que yo soy Dios.","author":"Salmo 46:10"},{"cat":"fe","text":"Lámpara es a mis pies tu palabra, y luz para mi camino.","author":"Salmo 119:105"},{"cat":"fe","text":"Te basta mi gracia, porque mi poder se perfecciona en la debilidad.","author":"2 Corintios 12:9"},{"cat":"fe","text":"Sus misericordias se renuevan cada mañana; grande es tu fidelidad.","author":"Lamentaciones 3:22-23"},{"cat":"fe","text":"Cercano está el Señor a los que tienen el corazón roto.","author":"Salmo 34:18"},{"cat":"fe","text":"Yo sé los planes que tengo para vosotros: planes de bien y no de mal, para daros un futuro y una esperanza.","author":"Jeremías 29:11"},{"cat":"fe","text":"Dios no nos ha dado un espíritu de miedo, sino de fuerza, de amor y de dominio propio.","author":"2 Timoteo 1:7"},{"cat":"fe","text":"La paz os dejo, mi paz os doy. No se turbe vuestro corazón ni tenga miedo.","author":"Juan 14:27"},{"cat":"fe","text":"Este es el día que hizo el Señor; alegrémonos y gocémonos en él.","author":"Salmo 118:24"},{"cat":"fe","text":"Todo tiene su momento, y cada cosa bajo el cielo tiene su hora.","author":"Eclesiastés 3:1"},{"cat":"fe","text":"Todo lo que hagáis, hacedlo de corazón.","author":"Colosenses 3:23"},{"cat":"fe","text":"No nos cansemos de hacer el bien, porque a su tiempo cosecharemos si no desfallecemos.","author":"Gálatas 6:9"},{"cat":"fe","text":"Ama a tu prójimo como a ti mismo.","author":"Mateo 22:39"},{"cat":"fe","text":"La alegría del Señor es vuestra fuerza.","author":"Nehemías 8:10"},{"cat":"fe","text":"Clama a mí, y yo te responderé.","author":"Jeremías 33:3"},{"cat":"fe","text":"Todo es posible para el que cree.","author":"Marcos 9:23"},{"cat":"fe","text":"El que comenzó en vosotros la buena obra la llevará a término.","author":"Filipenses 1:6"},{"cat":"fe","text":"Nos hiciste, Señor, para ti, y nuestro corazón está inquieto hasta que descanse en ti.","author":"San Agustín"},{"cat":"fe","text":"Ama y haz lo que quieras.","author":"San Agustín"},{"cat":"fe","text":"Nada te turbe, nada te espante; todo se pasa, Dios no se muda.","author":"Santa Teresa de Jesús"},{"cat":"fe","text":"La paciencia todo lo alcanza. Quien a Dios tiene nada le falta: solo Dios basta.","author":"Santa Teresa de Jesús"},{"cat":"fe","text":"A la tarde te examinarán en el amor.","author":"San Juan de la Cruz"},{"cat":"fe","text":"Donde no hay amor, pon amor, y sacarás amor.","author":"San Juan de la Cruz"},{"cat":"fe","text":"En tiempo de desolación nunca hacer mudanza.","author":"San Ignacio de Loyola"},{"cat":"fe","text":"Ten paciencia con todas las cosas, pero sobre todo contigo mismo.","author":"San Francisco de Sales"}]).map((q, i) => ({ id: i, cat: q.cat, text: q.text, author: q.author || null }));

  repeat: '<path d="M17 2.5 20.5 6 17 9.5"/><path d="M3.5 11V9a3 3 0 0 1 3-3h14M7 21.5 3.5 18 7 14.5"/><path d="M20.5 13v2a3 3 0 0 1-3 3h-14"/>',
};
const ico = (name, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[name] || ''}</svg>`;

/* ---------- Persistencia (localStorage, con respaldo en memoria) ---------- */
const KEY = 'impulso.web.v1';
const DEFAULTS = {
  favs: [], cat: 'general', theme: 'marea', streak: 0, lastDay: null, seenHint: false,
  onboardingDone: false, profile: { name: '', focus: [], area: [], goal: '', horizon: 'sinFecha', goalStart: null, obstacles: [], style: ['originales', 'clasicos'], moments: [] },
  progressDays: [], widgetGuideSeen: false,
};
let S;
try { S = Object.assign(structuredClone(DEFAULTS), JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch { S = structuredClone(DEFAULTS); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

// Las preguntas «qué quieres conseguir», «parte de tu vida» y «tipo de frases» admiten varias
// respuestas. Convierte las respuestas guardadas por la versión anterior (una sola) en listas.
const asList = v => Array.isArray(v) ? v : v ? [v] : [];
S.profile = Object.assign(structuredClone(DEFAULTS.profile), S.profile);
S.profile.focus = asList(S.profile.focus);
S.profile.area = asList(S.profile.area);
S.profile.style = S.profile.style === 'ambas' ? ['originales', 'clasicos'] : asList(S.profile.style);
if (!S.profile.style.length) S.profile.style = ['originales', 'clasicos'];
// El catálogo de frases se reescribió (versión 2): las favoritas antiguas apuntarían a otras frases.
if (S.quotesVersion !== 2) { S.favs = []; S.quotesVersion = 2; save(); }
const firstArea = p => AREAS.find(a => a.id === p.area[0]);
const toggleIn = (list, id) => list.includes(id) ? list.filter(x => x !== id) : [...list, id];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
const listY = arr => arr.length < 2 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' y ' + arr[arr.length - 1];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hexRgb = h => { const v = parseInt(h.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };

/* ---------- Lógica de frases (igual que QuoteStore.swift) ---------- */
function weightsOf(p) {
  const r = {};
  const add = w => { for (const k in w) r[k] = (r[k] || 0) + w[k]; };
  FOCUS.filter(x => p.focus.includes(x.id)).forEach(f => add(f.w));
  AREAS.filter(x => p.area.includes(x.id)).forEach(a => add(a.w));
  (p.obstacles || []).forEach(id => { const o = OBSTACLES.find(x => x.id === id); if (o) add(o.w); });
  // La fe aparece en «Para ti» para todo el mundo, con más peso si se ha elegido «Crecer en mi fe».
  if (Object.keys(r).length) r.fe = (r.fe || 0) + 1;
  return r;
}
// Con los dos estilos marcados (o ninguno) valen todas las frases.
const matchesStyle = (p, q) => p.style.length !== 1 ? true : p.style[0] === 'clasicos' ? !!q.author : !q.author;
function personalized(p) {
  const w = weightsOf(p);
  if (!Object.keys(w).length) return QUOTES.filter(q => matchesStyle(p, q));
  const byCat = QUOTES.filter(q => (w[q.cat] || 0) > 0);
  const styled = byCat.filter(q => matchesStyle(p, q));
  return styled.length >= 12 ? styled : byCat;
}
function pool(cat) {
  if (cat === 'parati') return personalized(S.profile);
  if (cat === 'general') return QUOTES.slice();
  if (cat === 'favoritas') return QUOTES.filter(q => S.favs.includes(q.id));
  return QUOTES.filter(q => q.cat === cat);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ordered(list, cat) {
  const w = weightsOf(S.profile);
  if (cat !== 'parati' || !Object.keys(w).length) return shuffle(list);
  // Muestreo ponderado sin reemplazo: clave = u^(1/peso)
  return list.map(q => [q, Math.pow(Math.random() || 1e-9, 1 / Math.max(w[q.cat] || .5, .1))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
// Frase del día determinista (SplitMix64), la misma que la app nativa y el widget.
function quoteOfTheDay(d = new Date()) {
  const M = (1n << 64n) - 1n;
  let x = (BigInt(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) + 0x9E3779B97F4A7C15n) & M;
  x = ((x ^ (x >> 30n)) * 0xBF58476D1CE4E5B9n) & M;
  x = ((x ^ (x >> 27n)) * 0x94D049BB133111EBn) & M;
  x ^= x >> 31n;
  return QUOTES[Number(x % BigInt(QUOTES.length))];
}
function topCats(p, n) {
  const w = weightsOf(p);
  return Object.keys(w).sort((a, b) => w[b] - w[a] || a.localeCompare(b)).slice(0, n);
}

/* ---------- Tema ---------- */
function applyTheme() {
  const t = themeById(S.theme), app = $('#app'), [r, g, b] = hexRgb(t.text);
  $('#bg').style.background = t.bg;
  $('#scrim').style.opacity = t.scrim;
  app.classList.toggle('light', !!t.light);
  app.classList.toggle('large-author', !!t.large);
  app.style.setProperty('--bgfull', `linear-gradient(rgba(0,0,0,${t.scrim}),rgba(0,0,0,${t.scrim})),${t.bg}`);
  app.style.setProperty('--text', t.text);
  app.style.setProperty('--sub', `rgba(${r},${g},${b},${t.light ? .78 : .8})`);
  app.style.setProperty('--author', t.author);
  app.style.setProperty('--shadow', t.light ? .06 : .25);
  app.style.setProperty('--on-text', t.light ? '#ffffff' : '#1c2026');
  app.style.setProperty('--edge', t.light ? 'rgba(255,255,255,.32)' : 'rgba(0,0,0,.26)');
  document.querySelector('meta[name=theme-color]').content = t.bg.match(/#[0-9a-f]{6}/i)[0];
  // Lo que asome por detrás de la app (rebote de Safari, barras del sistema) tiene el color del tema.
  document.documentElement.style.setProperty('--page-bg', t.bg.match(/#[0-9a-f]{6}/i)[0]);
}

/* ---------- Racha ---------- */
function registerOpen() {
  const today = new Date();
  if (S.lastDay) {
    const diff = daysBetween(new Date(S.lastDay), today);
    if (diff <= 0) { S.streak = Math.max(S.streak, 1); save(); return; }
    S.streak = diff === 1 ? S.streak + 1 : 1;
  } else S.streak = 1;
  S.lastDay = startOfDay(today).toISOString();
  save();
}
const renderStreak = () => {
  $('#streak').innerHTML = `${ico('flame')}<span>${S.streak} ${S.streak === 1 ? 'día' : 'días'}</span>`;
  $('#streak').setAttribute('aria-label', `Racha: ${S.streak} ${S.streak === 1 ? 'día' : 'días'}`);
};

/* ---------- Feed ---------- */
const feedEl = $('#feed');
let items = [], nextId = 0;
// Las frases que salen de la pantalla se ocultan para volver a entrar con una animación suave.
const io = new IntersectionObserver(entries => entries.forEach(e => {
  e.target.classList.toggle('out', e.intersectionRatio < .5);
}), { root: feedEl, threshold: [0, .5] });

function rebuildFeed() {
  items = [];
  let p = pool(S.cat);
  if (p.length) {
    if (S.cat === 'general' || S.cat === 'parati') {
      const today = quoteOfTheDay();
      items.push({ id: nextId++, kind: 'quote', q: today, qotd: true });
      p = p.filter(q => q.id !== today.id);
    }
    if (S.cat === 'parati' && S.profile.goal.trim()) items.push({ id: nextId++, kind: 'goal' });
    ordered(p, S.cat).forEach(q => items.push({ id: nextId++, kind: 'quote', q }));
  }
  feedEl.innerHTML = '';
  if (!items.length) feedEl.appendChild(emptyCard());
  else items.forEach(it => feedEl.appendChild(renderItem(it)));
  feedEl.scrollTop = 0;
  renderBars();
}

function loadMore() {
  let batch = ordered(pool(S.cat), S.cat);
  if (batch.length < 2) return;
  const last = [...items].reverse().find(i => i.q);
  if (last && batch[0].id === last.q.id) { const j = 1 + Math.floor(Math.random() * (batch.length - 1)); [batch[0], batch[j]] = [batch[j], batch[0]]; }
  batch.forEach(q => { const it = { id: nextId++, kind: 'quote', q }; items.push(it); feedEl.appendChild(renderItem(it)); });
}

const fontSize = t => t.length <= 48 ? 34 : t.length <= 80 ? 30 : 26;

function renderItem(it) {
  if (it.kind === 'goal') return goalCard();
  const q = it.q, fav = S.favs.includes(q.id), first = it === items[0];
  const name = S.profile.name.trim();
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `
    <div class="qwrap" role="group" aria-label="${esc(q.text)}${q.author ? ', ' + esc(q.author) : ''}">
      ${it.qotd ? `<div class="label">${name ? 'Tu frase de hoy, ' + esc(name) : 'Frase del día'}</div>` : ''}
      <div class="qmark" aria-hidden="true">“</div>
      <p class="quote" style="font-size:${fontSize(q.text)}px">${esc(q.text)}</p>
      ${q.author ? `<p class="author">${esc(q.author)}</p>` : ''}
    </div>
    <div class="actions">
      <button class="cbtn glass press" data-act="share" aria-label="Compartir frase">${ico('share')}</button>
      <button class="cbtn glass press ${fav ? 'on' : ''}" data-act="like" data-qid="${q.id}" aria-label="${fav ? 'Quitar de favoritas' : 'Guardar en favoritas'}">${ico('heart')}</button>
    </div>
    ${it.qotd && !S.widgetGuideSeen ? `<button class="suggest glass press" data-act="widget">${ico('lock')}Ponla en tu pantalla de bloqueo</button>` : ''}
    <div class="bigheart" aria-hidden="true"><svg viewBox="0 0 24 24">${P.heart}</svg></div>
    ${first && !S.seenHint ? `<div class="hint" aria-hidden="true">${ico('chevup')}Desliza hacia arriba</div>` : ''}`;
  el.querySelector('[data-act=share]').onclick = () => share(q);
  el.querySelector('[data-act=like]').onclick = () => toggleFav(q);
  const w = el.querySelector('[data-act=widget]'); if (w) w.onclick = () => openWidgetGuide('lock');
  // Doble toque = guardar en favoritas
  let lastTap = 0;
  el.querySelector('.qwrap').addEventListener('pointerup', e => {
    const now = Date.now();
    if (now - lastTap < 320) { saveFav(q); const h = el.querySelector('.bigheart'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); lastTap = 0; }
    else lastTap = now;
  });
  io.observe(el);
  return el;
}

function goalCard() {
  const p = S.profile, done = S.progressDays.includes(dayKey(new Date()));
  const day = p.goalStart ? Math.max(daysBetween(new Date(p.goalStart), new Date()), 0) + 1 : 1;
  const hz = HORIZONS.find(h => h.id === p.horizon);
  const area = firstArea(p);
  const n = S.progressDays.length;
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `
    <div class="qwrap" style="gap:18px">
      <div class="label" style="display:flex;gap:6px;align-items:center">${ico(area ? area.icon : 'target').replace('class="i"', 'class="i" style="width:15px;height:15px"')}Tu objetivo</div>
      <p class="goal-title">${esc(p.goal.trim())}</p>
      <div class="chips">
        <span class="chip glass">Día ${day}</span>
        ${p.horizon !== 'sinFecha' ? `<span class="chip glass">${hz.title}</span>` : ''}
        ${n ? `<span class="chip glass">${n} ${n === 1 ? 'día avanzando' : 'días avanzando'}</span>` : ''}
      </div>
      <p class="goal-q">${done ? 'Hoy ya has dado un paso. Mañana, otro.' : '¿Qué pequeño paso puedes dar hoy?'}</p>
    </div>
    <button class="progress-btn glass press ${done ? 'on' : ''}" aria-pressed="${done}">${ico(done ? 'checkc' : 'circle')}${done ? 'Hoy he avanzado' : 'Marcar que hoy he avanzado'}</button>
    <button class="linkbtn">Cambiar objetivo</button>`;
  el.querySelector('.progress-btn').onclick = () => {
    const k = dayKey(new Date());
    if (S.progressDays.includes(k)) S.progressDays = S.progressDays.filter(x => x !== k);
    else { S.progressDays.push(k); toast('¡Un paso más hacia tu objetivo!'); }
    save(); el.replaceWith(goalCard());
  };
  el.querySelector('.linkbtn').onclick = () => openOnboarding();
  io.observe(el);
  return el;
}

function emptyCard() {
  const el = document.createElement('section');
  el.className = 'card empty';
  el.innerHTML = `${ico('heart').replace('class="i"', 'class="i" style="width:34px;height:34px;color:var(--sub)"')}
    <h2>Aún no tienes favoritas</h2>
    <p>Toca el corazón o haz doble toque sobre una frase para guardarla aquí.</p>
    <button class="glass press">Ver todas las frases</button>`;
  el.querySelector('button').onclick = () => selectCat('general');
  return el;
}

feedEl.addEventListener('scroll', () => {
  const idx = Math.round(feedEl.scrollTop / feedEl.clientHeight);
  if (idx > 0 && !S.seenHint) { S.seenHint = true; save(); feedEl.querySelectorAll('.hint').forEach(h => { h.style.opacity = 0; setTimeout(() => h.remove(), 300); }); }
  if (items.length && idx >= items.length - 3) loadMore();
}, { passive: true });

/* ---------- Acciones ---------- */
function selectCat(id) { S.cat = id; save(); rebuildFeed(); }

function refreshLikes(qid) {
  const fav = S.favs.includes(qid);
  feedEl.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => {
    b.classList.toggle('on', fav); b.setAttribute('aria-label', fav ? 'Quitar de favoritas' : 'Guardar en favoritas');
    if (fav) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  });
}
function toggleFav(q) {
  if (S.favs.includes(q.id)) { S.favs = S.favs.filter(x => x !== q.id); toast('Quitada de favoritas', 'heart'); }
  else { S.favs.push(q.id); toast('Guardada en favoritas', 'heart', true); }
  save(); refreshLikes(q.id);
}
function saveFav(q) {
  if (S.favs.includes(q.id)) return;
  S.favs.push(q.id); save(); refreshLikes(q.id); toast('Guardada en favoritas', 'heart', true);
}

async function share(q) {
  const text = `“${q.text}”${q.author ? ' — ' + q.author : ''}\n\nVía Impulso`;
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Frase copiada para compartir'); }
  catch { toast('No se ha podido compartir'); }
}

let toastTimer;
function toast(msg, icon = 'check', filled = false) {
  const t = $('#toast');
  t.innerHTML = ico(icon, filled ? 'i fill' : 'i') + `<span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function renderBars() {
  const c = CATS.find(x => x.id === S.cat) || CATS[1];
  $('#catBtn').innerHTML = `${ico(c.icon)}<span>${c.name}</span>${ico('chevdown', 'i chev')}`;
  $('#favBtn').innerHTML = ico('bookmark');
  $('#favBtn').classList.toggle('on', S.cat === 'favoritas');
  $('#themeBtn').innerHTML = ico('brush');
  $('#bellBtn').innerHTML = ico('bell');

}

/* ---------- Hojas ---------- */
function openSheet(build, tall = false) {
  const host = $('#sheets');
  host.innerHTML = `<div class="overlay"></div><div class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true"><div class="grabber"></div><button class="sheet-close press" aria-label="Cerrar">${ico('close')}</button><div class="sheet-body"></div></div>`;
  const ov = host.querySelector('.overlay'), sh = host.querySelector('.sheet');
  sh.querySelector('.sheet-close').onclick = closeSheet;
  build(host.querySelector('.sheet-body'));
  requestAnimationFrame(() => { ov.classList.add('show'); sh.classList.add('show'); });
  ov.onclick = closeSheet;
  // Arrastrar el tirador hacia abajo cierra la hoja
  let y0 = null;
  const grab = host.querySelector('.grabber');
  sh.addEventListener('touchstart', e => { if (e.target === grab || sh.querySelector('.sheet-body').scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 !== null) { const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transform = ''; if (dy > 90) closeSheet(); });
}
function closeSheet() {
  const host = $('#sheets'), ov = host.querySelector('.overlay'), sh = host.querySelector('.sheet');
  if (!sh) return;
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(() => { host.innerHTML = ''; }, 380);
}

function themeSheet(body) {

const thumb = (t, labelColor, h = 150) => `<button class="thumb press ${t.id === S.theme ? 'on' : ''}" data-id="${t.id}" aria-pressed="${t.id === S.theme}" style="color:${labelColor}">

/* ---------- Tus respuestas (editar el perfil) ---------- */
function profileSheet(body) {
  const p = S.profile;
  const fs = FOCUS.filter(x => p.focus.includes(x.id)), as = AREAS.filter(x => p.area.includes(x.id));
  const f = fs.length && { icon: fs[0].icon, title: listY(fs.map(x => x.title)) };

// Código del widget para Scriptable (se inserta al generar la página desde impulso-widget.js).
const WIDGET_SCRIPT = "// Impulso · Frase del día\n// Widget para la app Scriptable (iPhone). Muestra la misma frase del día que la app Impulso.\n// Funciona con todos los tamaños de widget:\n//   Pantalla de bloqueo: en línea (encima de la hora), rectangular y circular.\n//   Pantalla de inicio, vista «Hoy» y StandBy: pequeño, mediano, grande y extra grande (iPad).\n// Se actualiza solo cada medianoche.\n// Si abres el script dentro de Scriptable, la frase se muestra a pantalla completa.\n// Opcional: en el campo «Parameter» del widget puedes escribir un tema:\n// marea, alba, bosque, noche, arena, lavanda, terraza, niebla u oceano.\n\nconst APP_URL = \"https://alvarosoriiiaa.github.io/impulso/\";\nconst QUOTES_URL = APP_URL + \"quotes.json\";\n\nconst THEMES = {\n  marea:   { colors: [\"#1d2b3a\", \"#2c4a5e\", \"#6a8a8c\"], text: \"#fbf8f2\", scrim: 0.06 },\n  alba:    { colors: [\"#f6b17a\", \"#e9787a\", \"#7a4f86\"], text: \"#fffaf4\", scrim: 0.2 },\n  bosque:  { colors: [\"#13261d\", \"#24453a\", \"#5b7a5a\"], text: \"#f2f5ec\", scrim: 0 },\n  noche:   { colors: [\"#2a2f4a\", \"#12141f\", \"#07080d\"], text: \"#f1f0fa\", scrim: 0 },\n  arena:   { colors: [\"#f3ead9\", \"#e6d6bb\"], text: \"#2b2620\", scrim: 0 },\n  lavanda: { colors: [\"#c8c2ea\", \"#9a8fcf\", \"#5d548f\"], text: \"#fbfaff\", scrim: 0.2 },\n  terraza: { colors: [\"#b4472f\", \"#d88450\", \"#f0c38a\"], text: \"#fff8ef\", scrim: 0.22 },\n  niebla:  { colors: [\"#e9ecef\", \"#c9d1d8\"], text: \"#1e252c\", scrim: 0 },\n  oceano:  { colors: [\"#022b44\", \"#05607a\", \"#3fb1b0\"], text: \"#f0fbfb\", scrim: 0.14 },\n};\n\n// Frases: se descargan de la web y se guardan para funcionar también sin conexión.\nasync function loadQuotes() {\n  const fm = FileManager.local();\n  const cache = fm.joinPath(fm.documentsDirectory(), \"impulso-quotes.json\");\n  try {\n    const quotes = await new Request(QUOTES_URL).loadJSON();\n    fm.writeString(cache, JSON.stringify(quotes));\n    return quotes;\n  } catch (e) {\n    if (fm.fileExists(cache)) return JSON.parse(fm.readString(cache));\n    return [{ text: \"Conéctate a internet una vez para cargar tus frases.\" }];\n  }\n}\n\n// Misma fórmula que la app (SplitMix64 sobre la fecha): la frase coincide en todas partes.\nfunction quoteOfTheDay(quotes, d) {\n  const M = (1n \u003c\u003c 64n) - 1n;\n  let x = (BigInt(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) + 0x9E3779B97F4A7C15n) \u0026 M;\n  x = ((x ^ (x \u003e\u003e 30n)) * 0xBF58476D1CE4E5B9n) \u0026 M;\n  x = ((x ^ (x \u003e\u003e 27n)) * 0x94D049BB133111EBn) \u0026 M;\n  x ^= x \u003e\u003e 31n;\n  return quotes[Number(x % BigInt(quotes.length))];\n}\n\nfunction darken(hex, amount) {\n  const v = parseInt(hex.slice(1), 16);\n  const f = c =\u003e Math.round(c * (1 - amount)).toString(16).padStart(2, \"0\");\n  return \"#\" + f((v \u003e\u003e 16) \u0026 255) + f((v \u003e\u003e 8) \u0026 255) + f(v \u0026 255);\n}\n\nfunction esc(s) {\n  return String(s).replace(/[\u0026\u003c\u003e\"]/g, c =\u003e ({ \"\u0026\": \"\u0026amp;\", \"\u003c\": \"\u0026lt;\", \"\u003e\": \"\u0026gt;\", '\"': \"\u0026quot;\" }[c]));\n}\n\nconst quotes = await loadQuotes();\nconst q = quoteOfTheDay(quotes, new Date());\nconst theme = THEMES[(args.widgetParameter || \"\").trim().toLowerCase()] || THEMES.marea;\n\n// ---------- Dentro de Scriptable: la frase a pantalla completa ----------\nif (!config.runsInWidget) {\n  const colors = theme.colors.map(c =\u003e darken(c, theme.scrim));\n  const html = `\u003c!DOCTYPE html\u003e\u003chtml\u003e\u003chead\u003e\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\"\u003e\n\u003cstyle\u003e\n  html, body { margin: 0; height: 100%; }\n  body {\n    min-height: 100vh; box-sizing: border-box;\n    display: flex; flex-direction: column; align-items: center; justify-content: center;\n    padding: calc(env(safe-area-inset-top) + 32px) 32px calc(env(safe-area-inset-bottom) + 32px);\n    background: linear-gradient(160deg, ${colors.join(\", \")}) fixed;\n    color: ${theme.text}; text-align: center;\n    -webkit-font-smoothing: antialiased;\n  }\n  .label { font: 600 13px -apple-system, system-ui; letter-spacing: .14em; opacity: .75; margin-bottom: 28px; }\n  .quote { font-family: Georgia, serif; font-size: clamp(28px, 8.5vw, 48px); line-height: 1.3; margin: 0; }\n  .author { font: 600 14px -apple-system, system-ui; letter-spacing: .12em; opacity: .8; margin-top: 24px; }\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n  \u003cdiv class=\"label\"\u003eFRASE DEL DÍA\u003c/div\u003e\n  \u003cp class=\"quote\"\u003e${esc(q.text)}\u003c/p\u003e\n  ${q.author ? `\u003cdiv class=\"author\"\u003e${esc(q.author.toUpperCase())}\u003c/div\u003e` : \"\"}\n\u003c/body\u003e\u003c/html\u003e`;\n  await WebView.loadHTML(html, null, null, true); // true = pantalla completa\n  Script.complete();\n  return;\n}\n\n// ---------- Widget ----------\nconst family = config.widgetFamily || \"large\";\n\nconst w = new ListWidget();\nw.url = APP_URL;\nconst midnight = new Date();\nmidnight.setHours(24, 0, 30, 0);\nw.refreshAfterDate = midnight;\n\nif (family === \"accessoryInline\") {\n  // Pantalla de bloqueo: una línea encima de la hora\n  const t = w.addText(\"❝ \" + q.text);\n  t.lineLimit = 1;\n  t.minimumScaleFactor = 0.7;\n} else if (family === \"accessoryCircular\") {\n  // Pantalla de bloqueo: círculo pequeño debajo de la hora. Al tocarlo se abre la frase completa.\n  w.addAccessoryWidgetBackground = true;\n  w.setPadding(4, 4, 4, 4);\n  w.addSpacer();\n  const row = w.addStack();\n  row.addSpacer();\n  const icon = row.addImage(SFSymbol.named(\"quote.opening\").image);\n  icon.imageSize = new Size(16, 16);\n  icon.tintColor = Color.white();\n  row.addSpacer();\n  w.addSpacer(2);\n  const day = w.addText(String(new Date().getDate()));\n  day.font = Font.boldRoundedSystemFont(15);\n  day.centerAlignText();\n  w.addSpacer();\n} else if (family.startsWith(\"accessory\")) {\n  // Pantalla de bloqueo: rectángulo debajo de la hora\n  const t = w.addText(q.text);\n  t.font = Font.mediumSystemFont(13);\n  t.minimumScaleFactor = 0.6;\n  t.lineLimit = q.author ? 3 : 4;\n  if (q.author) {\n    const a = w.addText(q.author);\n    a.font = Font.systemFont(10);\n    a.textOpacity = 0.7;\n    a.lineLimit = 1;\n  }\n} else {\n  // Pantalla de inicio, vista «Hoy» y StandBy: pequeño, mediano, grande y extra grande (iPad).\n  // El degradado ocupa todo el widget y la frase se agranda para llenarlo.\n  const g = new LinearGradient();\n  g.colors = theme.colors.map(c =\u003e new Color(darken(c, theme.scrim)));\n  g.locations = theme.colors.map((_, i) =\u003e i / (theme.colors.length - 1));\n  g.startPoint = new Point(0.3, 0);\n  g.endPoint = new Point(0.7, 1);\n  w.backgroundGradient = g;\n\n  const big = family === \"large\" || family === \"extraLarge\";\n  w.setPadding(big ? 18 : 12, big ? 18 : 12, big ? 18 : 12, big ? 18 : 12);\n\n  // Tamaño grande de partida; minimumScaleFactor lo reduce lo justo para que quepa\n  const size = { small: 26, medium: 30, large: 44, extraLarge: 56 }[family] || 30;\n\n  if (big) {\n    const label = w.addText(\"FRASE DEL DÍA\");\n    label.font = Font.semiboldSystemFont(family === \"extraLarge\" ? 14 : 12);\n    label.textColor = new Color(theme.text, 0.75);\n    label.centerAlignText();\n    w.addSpacer(8);\n  }\n  w.addSpacer();\n  const t = w.addText(q.text);\n  t.font = new Font(\"Georgia\", size);\n  t.textColor = new Color(theme.text);\n  t.centerAlignText();\n  t.minimumScaleFactor = 0.25;\n  if (q.author) {\n    w.addSpacer(big ? 10 : 6);\n    const a = w.addText(q.author.toUpperCase());\n    a.font = Font.semiboldSystemFont(family === \"small\" ? 9 : big ? 13 : 11);\n    a.textColor = new Color(theme.text, 0.8);\n    a.centerAlignText();\n    a.lineLimit = 1;\n  }\n  w.addSpacer();\n}\n\nScript.setWidget(w);\nScript.complete();\n";

/* ---------- Cuestionario de bienvenida ---------- */
const STEP_LIST = ['welcome', 'name', 'focus', 'area', 'goal', 'obstacles', 'style', 'moments', 'theme', 'widget', 'summary'];
let draft, step, forward = true;
// Con editing = true se abre una sola pregunta desde «Tus respuestas», con Guardar y Cancelar.
let editing = false;

function openOnboarding(only) {
  draft = structuredClone(S.profile);
  editing = !!only;
  step = only || 'welcome';
  forward = true;
  $('#onb').classList.remove('hide');
  renderOnb();
}
function closeOnboarding() { $('#onb').classList.add('hide'); setTimeout(() => { $('#onb').innerHTML = ''; }, 350); }

function go(delta) {
  if (editing) { if (delta > 0) { finishOnboarding(); toast('Respuesta guardada'); } else closeOnboarding(); return; }
  const i = STEP_LIST.indexOf(step) + delta;
  if (i >= STEP_LIST.length) return finishOnboarding();
  if (i < 0) return;
  forward = delta > 0; step = STEP_LIST[i]; renderOnb();
}

function opt({ title, sub, icon, on, multi }) {
  return `<button class="opt glass press ${on ? 'on' : ''} ${multi ? 'multi' : ''}" aria-pressed="${!!on}">
    ${icon ? `<span class="ic">${ico(icon)}</span>` : ''}
    <span class="tx"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>
    <span class="mk">${ico('check')}</span></button>`;
}
