<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impulso">
<meta name="theme-color" content="#1d2b3a">
<title>Impulso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d12;overscroll-behavior:none}
body{font-family:'Figtree',system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:root{--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--accent:#ff5a6e;--sheet:#f6f3ee;--sheet-text:#1c2026}

/* Columna de móvil: a pantalla completa en el teléfono, centrada y estrecha en ordenador */
#app{position:relative;width:100%;max-width:440px;height:100dvh;overflow:hidden;color:var(--text);isolation:isolate}
@media (min-width:600px) and (min-height:700px){
  #app{height:min(100dvh - 40px,900px);border-radius:40px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px #000}
}

.bg{position:absolute;inset:0;z-index:-2;transition:opacity .45s ease}
.bg .scrim{position:absolute;inset:0;background:#000}
.grain{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.18;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.glass{background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid rgba(255,255,255,.22)}
.light .glass{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.12);-webkit-backdrop-filter:none;backdrop-filter:none}
.press{transition:transform .18s cubic-bezier(.3,.7,.4,1)}
.press:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.press:active{transform:none;opacity:.7}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 30px 130px;text-align:center}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:20px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.label{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
.quote{font-family:var(--serif);font-weight:500;line-height:1.22;max-width:11em;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,var(--shadow))}
.author{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;opacity:var(--author)}
.large-author .author{font-size:14px;font-weight:700}
.actions{display:flex;gap:18px;margin-top:36px}
.cbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.cbtn.on{background:#fff;border-color:#fff;color:var(--accent)}
.cbtn.on svg{fill:var(--accent);stroke:var(--accent)}
.suggest{margin-top:22px;height:40px;padding:0 16px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.suggest svg{width:17px;height:17px}
.bigheart{position:absolute;left:50%;top:44%;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;opacity:0;filter:drop-shadow(0 6px 16px rgba(0,0,0,.25))}
.bigheart svg{width:100%;height:100%;fill:var(--accent)}
.bigheart.go{animation:heart .8s ease forwards}
@keyframes heart{0%{opacity:0;transform:scale(.4)}12%{opacity:1}38%{transform:scale(1.05)}45%{transform:scale(1)}69%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.hint{position:absolute;bottom:calc(120px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--sub);transition:opacity .3s}
.hint svg{animation:bob .9s ease-in-out infinite alternate;width:20px;height:20px}
@keyframes bob{from{transform:translateY(2px)}to{transform:translateY(-6px)}}

/* Tarjeta del objetivo */
.goal-title{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.2;max-width:11em;text-shadow:0 2px 10px rgba(0,0,0,var(--shadow))}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{height:32px;padding:0 12px;border-radius:99px;display:inline-flex;align-items:center;font-size:13px;font-weight:600}
.goal-q{font-size:16px;color:var(--sub);margin-top:4px}
.progress-btn{margin-top:26px;height:52px;padding:0 22px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.progress-btn.on{background:var(--text);color:var(--on-text);border-color:var(--text)}
.linkbtn{margin-top:12px;font-size:14px;font-weight:600;color:var(--sub);padding:8px}

/* Barras */
.topbar,.bottombar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding:0 20px;z-index:5;pointer-events:none}
.topbar>*,.bottombar>*{pointer-events:auto}
.topbar{top:0;padding-top:calc(10px + env(safe-area-inset-top))}
.bottombar{bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.logo{font-family:var(--serif);font-style:italic;font-weight:600;font-size:30px;margin-right:auto}
.streak{height:36px;padding:0 13px;border-radius:99px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.streak svg{width:16px;height:16px;fill:#ff9f43;stroke:#ff9f43}
.rbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.rbtn svg{width:17px;height:17px}
.pillbtn{height:50px;padding:0 18px;border-radius:99px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-right:auto}
.pillbtn svg{width:18px;height:18px}
.bbtn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.bbtn svg{width:20px;height:20px}
.bbtn.on svg{fill:currentColor}

#toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:rgba(0,0,0,.72);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;z-index:20;pointer-events:none;transition:all .3s cubic-bezier(.3,.7,.4,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Hojas */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.overlay.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;max-height:88%;display:flex;flex-direction:column;background:var(--sheet);color:var(--sheet-text);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet.tall{height:88%}
.grabber{width:40px;height:5px;border-radius:3px;background:rgba(0,0,0,.18);margin:8px auto 4px;flex:none}
.sheet-body{overflow-y:auto;padding:12px 22px 32px;-webkit-overflow-scrolling:touch}
.sh-title{font-size:26px;font-weight:700}
.sh-sub{font-size:15px;color:rgba(28,32,38,.62);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.cat{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:16px;min-height:112px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cat.on{border:2px solid var(--sheet-text);padding:15px}
.cat b{font-size:17px}
.cat span{font-size:14px;color:rgba(28,32,38,.62)}
.cat small{margin-top:auto;font-size:12px;font-weight:600;color:rgba(28,32,38,.62);padding-top:12px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.thumb .sw{position:relative;width:100%;height:150px;border-radius:16px;overflow:hidden;display:grid;place-items:center;border:1px solid rgba(0,0,0,.08)}
.thumb .sw span{font-family:var(--serif);font-weight:600;font-size:30px;position:relative}
.thumb.on{font-weight:700}
.thumb.on .sw{border:2.5px solid currentColor}
.redo{margin-top:24px;width:100%;height:50px;border-radius:99px;border:1px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600}
.redo svg{width:18px;height:18px}
.note{font-size:13px;color:rgba(28,32,38,.62);margin-top:10px;text-align:center}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;width:100%;text-align:left}
.row svg{width:20px;height:20px;flex:none}
.row .chev{margin-left:auto;opacity:.4}
.section-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(28,32,38,.55);margin-top:26px}
.seg{display:flex;background:rgba(0,0,0,.07);border-radius:10px;padding:2px;margin-top:18px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.steps{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;font-size:15px;line-height:1.4}
.steps li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sheet-text);color:var(--sheet);font-style:normal;font-weight:700;font-size:14px;display:grid;place-items:center}
.darkbtn{margin-top:22px;width:100%;height:54px;border-radius:99px;background:var(--sheet-text);color:var(--sheet);font-size:17px;font-weight:700}

/* Vista previa del móvil */
.phone{position:relative;width:230px;height:300px;margin:22px auto 4px;border-radius:36px;overflow:hidden;border:7px solid #111;background:linear-gradient(#24324f,#5d4a74,#c98478);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center}
.phone .island{position:absolute;top:8px;left:50%;width:70px;height:20px;margin-left:-35px;background:#000;border-radius:99px}
.phone .date{margin-top:44px;font-size:13px;font-weight:600;text-transform:capitalize}
.phone .time{font-size:58px;font-weight:700;line-height:1.05;font-family:-apple-system,'SF Pro Rounded',system-ui,sans-serif;letter-spacing:-1px}
.phone .lw{width:166px;text-align:left;margin-top:6px;font-size:12px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.phone .lw small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.phone .hw{position:relative;margin-top:44px;width:190px;height:90px;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center;padding:10px}
.phone .hw p{position:relative;font-family:var(--serif);font-size:13.5px;line-height:1.2}
.phone .icons{display:grid;grid-template-columns:repeat(4,38px);gap:13px;margin-top:14px}
.phone .icons i{height:38px;border-radius:10px;background:rgba(255,255,255,.28)}

/* Cuestionario */
#onb{background:var(--bgfull)}
#onb{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;padding:0 22px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);transition:opacity .35s}
#onb.hide{opacity:0;pointer-events:none}
.onb-head{height:56px;display:flex;align-items:center;gap:14px;flex:none}
.onb-head .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.onb-head .back svg{width:18px;height:18px}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.light .bar{background:rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:var(--text);transition:width .3s}
.onb-body{flex:1;overflow-y:auto;padding:16px 0 24px;scrollbar-width:none}
.onb-body::-webkit-scrollbar{display:none}
.onb-body.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.onb-body.enter-back{animation:enterback .4s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes enterback{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.onb-foot{flex:none;padding:8px 0 12px;display:flex;flex-direction:column;gap:6px}
.q-title{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.12}
.q-sub{font-size:16px;color:var(--sub);margin-top:10px;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;text-align:left;width:100%}
.opt.on{box-shadow:inset 0 0 0 2px var(--text);background:rgba(255,255,255,.2)}
.light .opt.on{background:rgba(0,0,0,.1)}
.opt .ic svg{width:20px;height:20px}
.opt .tx{flex:1}
.opt .tx b{display:block;font-size:16px;font-weight:600}
.opt .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.opt .mk{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center}
.opt.multi .mk{border-radius:6px}
.opt.on .mk{background:var(--text);border-color:var(--text);color:var(--on-text)}
.opt .mk svg{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .mk svg{opacity:1}
.field{width:100%;margin-top:22px;padding:16px 20px;border-radius:18px;font-size:18px;font-weight:500;outline:none;resize:none}
.field::placeholder{color:var(--sub)}
.hz{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hz button{height:46px;border-radius:99px;font-size:15px;font-weight:600}
.hz button.on{background:var(--text);color:var(--on-text);border-color:var(--text)}
.primary{height:54px;border-radius:99px;background:var(--text);color:var(--on-text);font-size:17px;font-weight:700;width:100%}
.primary:disabled{opacity:.4}
.secondary{height:40px;font-size:15px;font-weight:600;color:var(--sub);width:100%}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;padding-top:60px}
.welcome .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:60px;line-height:1}
.welcome .lead{font-family:var(--serif);font-size:29px;line-height:1.15}
.welcome p{font-size:16px;color:var(--sub);line-height:1.45}
.welcome small{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
.welcome small svg{width:14px;height:14px}
.sum{display:flex;gap:14px;padding:16px;border-radius:18px;margin-top:12px;align-items:flex-start}
.sum svg{width:20px;height:20px;flex:none;margin-top:2px}
.sum small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sub)}
.sum p{font-size:16px;font-weight:500;margin-top:4px;line-height:1.35}
.webnote{font-size:13px;color:var(--sub);text-align:center;margin-top:14px;line-height:1.4}
.empty{gap:16px}
.empty h2{font-family:var(--serif);font-weight:600;font-size:32px}
.empty p{font-size:16px;color:var(--sub);max-width:300px;line-height:1.4}
.empty button{height:50px;padding:0 22px;border-radius:99px;font-size:15px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bg"><div class="scrim" id="scrim"></div></div>
  <div class="grain"></div>
  <main id="feed" aria-label="Frases"></main>

  <header class="topbar">
    <div class="logo" aria-label="Impulso">impulso</div>
    <button class="rbtn glass press" id="bellBtn" aria-label="Recordatorios y widgets"></button>
    <div class="streak glass" id="streak"></div>
  </header>

  <nav class="bottombar">
    <button class="pillbtn glass press" id="catBtn" aria-label="Categorías"></button>
    <button class="bbtn glass press" id="favBtn" aria-label="Favoritas"></button>
    <button class="bbtn glass press" id="themeBtn" aria-label="Temas"></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheets"></div>
  <div id="onb" class="hide"></div>
</div>

<script>
/* ---------- Datos ---------- */
const QUOTES = ([{"cat":"motivacion","text":"No necesitas verlo todo claro para dar el siguiente paso."},{"cat":"motivacion","text":"Hoy no tiene que ser perfecto. Solo tiene que contar."},{"cat":"motivacion","text":"Lo difícil de hoy es la fuerza de mañana."},{"cat":"motivacion","text":"Cada pequeño paso sigue siendo un paso hacia delante."},{"cat":"motivacion","text":"Tu único rival es la persona que eras ayer."},{"cat":"motivacion","text":"Empieza antes de sentirte preparado."},{"cat":"motivacion","text":"Las ganas llegan cuando ya has empezado."},{"cat":"motivacion","text":"Un día cualquiera puede ser el día en que todo cambió."},{"cat":"motivacion","text":"El viaje de mil millas comienza con un solo paso.","author":"Lao Tse"},{"cat":"motivacion","text":"No importa lo despacio que vayas, siempre que no te detengas.","author":"Confucio"},{"cat":"amor","text":"Trátate como tratarías a alguien a quien quieres."},{"cat":"amor","text":"No eres demasiado. Eres suficiente."},{"cat":"amor","text":"Descansar también es avanzar."},{"cat":"amor","text":"Mereces la misma paciencia que das a los demás."},{"cat":"amor","text":"Tu valor no depende de lo que produces."},{"cat":"amor","text":"Está bien ir despacio. Sigue siendo tu camino."},{"cat":"amor","text":"Habla contigo con la voz que usarías con un amigo."},{"cat":"amor","text":"Conocerse a uno mismo es el principio de toda sabiduría.","author":"Aristóteles"},{"cat":"disciplina","text":"La disciplina es elegir lo que más quieres por encima de lo que quieres ahora."},{"cat":"disciplina","text":"Los hábitos de hoy son los resultados de mañana."},{"cat":"disciplina","text":"Hazlo aunque no tengas ganas. Sobre todo si no tienes ganas."},{"cat":"disciplina","text":"La constancia gana a la intensidad."},{"cat":"disciplina","text":"Nadie verá el esfuerzo de hoy. Todos verán el resultado."},{"cat":"disciplina","text":"Ningún hombre es libre si no es dueño de sí mismo.","author":"Epicteto"},{"cat":"disciplina","text":"No es que tengamos poco tiempo, sino que perdemos mucho.","author":"Séneca"},{"cat":"calma","text":"Respira. Este momento es suficiente."},{"cat":"calma","text":"No todo necesita una respuesta inmediata."},{"cat":"calma","text":"Suelta lo que no depende de ti."},{"cat":"calma","text":"Lo que hoy te inquieta, mañana será un recuerdo."},{"cat":"calma","text":"Puedes parar sin abandonar."},{"cat":"calma","text":"Sufrimos más en la imaginación que en la realidad.","author":"Séneca"},{"cat":"calma","text":"La naturaleza no tiene prisa y, sin embargo, todo se cumple.","author":"Lao Tse"},{"cat":"exito","text":"El éxito se construye en los días que nadie ve."},{"cat":"exito","text":"No midas tu progreso con la regla de otros."},{"cat":"exito","text":"Fallar es parte del plan, no el final."},{"cat":"exito","text":"La suerte visita más a quien sigue intentándolo."},{"cat":"exito","text":"Haz bien las cosas pequeñas y las grandes llegarán."},{"cat":"exito","text":"Las grandes cosas no se hacen por impulso, sino por una serie de pequeñas cosas reunidas.","author":"Vincent van Gogh"},{"cat":"estoicismo","text":"Tienes poder sobre tu mente, no sobre los acontecimientos. Date cuenta y encontrarás la fuerza.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No son las cosas las que nos perturban, sino la opinión que tenemos de ellas.","author":"Epicteto"},{"cat":"estoicismo","text":"La felicidad de tu vida depende de la calidad de tus pensamientos.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Mientras esperamos vivir, la vida pasa.","author":"Séneca"},{"cat":"estoicismo","text":"Lo que se interpone en el camino se convierte en el camino.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Primero di qué quieres ser; después haz lo que tengas que hacer.","author":"Epicteto"},{"cat":"estoicismo","text":"Ninguna suerte es tan mala que un ánimo sereno no pueda sacar algo de ella."},{"cat":"motivacion","text":"Empieza pequeño, pero empieza hoy."},{"cat":"motivacion","text":"No esperes a tener ganas: las ganas vienen de camino."},{"cat":"motivacion","text":"Lo que hoy parece una montaña, mañana será una colina que ya subiste."},{"cat":"motivacion","text":"Cada mañana es una página en blanco. Escribe algo que valga la pena."},{"cat":"motivacion","text":"Tu futuro se decide en lo que haces hoy, no en lo que planeas para mañana."},{"cat":"motivacion","text":"Avanzar despacio sigue siendo avanzar."},{"cat":"motivacion","text":"Si te caes, mira desde el suelo lo lejos que has llegado."},{"cat":"motivacion","text":"Nadie empieza siendo bueno. Todos empiezan empezando."},{"cat":"motivacion","text":"No hace falta dejar de tener miedo para seguir adelante."},{"cat":"motivacion","text":"Hoy es un buen día para intentarlo otra vez."},{"cat":"motivacion","text":"Muchas cosas parecen imposibles hasta que alguien las intenta dos veces."},{"cat":"motivacion","text":"Un paso torpe también te acerca."},{"cat":"motivacion","text":"Tus sueños no caducan, pero tus excusas sí deberían."},{"cat":"motivacion","text":"La energía que buscas aparece cuando te mueves."},{"cat":"motivacion","text":"No tienes que ganar hoy. Solo tienes que no rendirte."},{"cat":"motivacion","text":"Cada intento te enseña algo que el miedo nunca te contará."},{"cat":"motivacion","text":"Mereces ver hasta dónde puedes llegar."},{"cat":"motivacion","text":"Ponte en marcha: el camino se aclara al andarlo."},{"cat":"motivacion","text":"Lo que empiezas hoy, mañana ya no te dará miedo."},{"cat":"motivacion","text":"Hay días para correr y días para caminar. Los dos cuentan."},{"cat":"motivacion","text":"Las metas grandes se rompen en tareas pequeñas."},{"cat":"motivacion","text":"El cansancio pasa. El orgullo de haberlo hecho se queda."},{"cat":"motivacion","text":"Lo que no intentas ya tiene respuesta: no."},{"cat":"motivacion","text":"Un buen día empieza con una decisión, no con un despertador."},{"cat":"motivacion","text":"Atrévete a ser principiante."},{"cat":"motivacion","text":"Hoy puedes ser un poco más valiente que ayer."},{"cat":"motivacion","text":"Sigue probando: a menudo abre la última llave del llavero."},{"cat":"motivacion","text":"Elige un pequeño reto y gánalo antes de comer."},{"cat":"motivacion","text":"No se trata de tener tiempo, sino de hacerle sitio a lo que importa."},{"cat":"motivacion","text":"La duda pregunta «¿y si sale mal?». El impulso responde «¿y si sale bien?»."},{"cat":"motivacion","text":"Cada día trae una nueva oportunidad de empezar distinto."},{"cat":"motivacion","text":"Lo que hoy te cuesta, mañana te saldrá solo."},{"cat":"motivacion","text":"El primer paso no tiene que ser bonito. Tiene que darse."},{"cat":"motivacion","text":"Tu ritmo es válido aunque no sea el de los demás."},{"cat":"motivacion","text":"Lo que sueñas merece al menos un intento serio."},{"cat":"motivacion","text":"Hoy no busques la perfección. Busca el movimiento."},{"cat":"motivacion","text":"Lo que te asusta suele ser justo lo que te hace crecer."},{"cat":"motivacion","text":"Quien ha empezado ya tiene hecha la mitad. Atrévete a saber.","author":"Horacio"},{"cat":"motivacion","text":"No nos atrevemos a muchas cosas porque son difíciles; son difíciles porque no nos atrevemos.","author":"Séneca"},{"cat":"motivacion","text":"Nada grande se ha logrado jamás sin entusiasmo.","author":"Ralph Waldo Emerson"},{"cat":"motivacion","text":"Si uno avanza con confianza en la dirección de sus sueños, encontrará un éxito inesperado.","author":"Henry David Thoreau"},{"cat":"motivacion","text":"Caminante, no hay camino, se hace camino al andar.","author":"Antonio Machado"},{"cat":"motivacion","text":"Sé paciente y resiste: algún día este dolor te será útil.","author":"Ovidio"},{"cat":"amor","text":"Eres un hogar, no un proyecto a medio terminar."},{"cat":"amor","text":"No tienes que ganarte el descanso."},{"cat":"amor","text":"Lo que sientes es válido, aunque no sepas explicarlo."},{"cat":"amor","text":"Hoy, sé tu lugar seguro."},{"cat":"amor","text":"Puedes querer mejorar y quererte ya."},{"cat":"amor","text":"Tus errores no te definen; te enseñan."},{"cat":"amor","text":"Decir que no también es cuidarte."},{"cat":"amor","text":"No necesitas permiso para ocupar tu espacio."},{"cat":"amor","text":"Celebra lo pequeño: también es tuyo."},{"cat":"amor","text":"El cuerpo que tienes te ha traído hasta aquí. Dale las gracias."},{"cat":"amor","text":"No eres tus peores días."},{"cat":"amor","text":"Perdonarte no es rendirte; es soltar peso para seguir."},{"cat":"amor","text":"Tu sensibilidad no es una debilidad."},{"cat":"amor","text":"Está bien no estar bien durante un rato."},{"cat":"amor","text":"Mereces cosas buenas sin tener que demostrar nada."},{"cat":"amor","text":"Mírate con la ternura con la que miras lo que amas."},{"cat":"amor","text":"Ser amable contigo también es una forma de disciplina."},{"cat":"amor","text":"Tu historia no ha terminado. Estás en mitad de un capítulo."},{"cat":"amor","text":"No tienes que ser fuerte todo el tiempo."},{"cat":"amor","text":"Puedes poner límites con cariño."},{"cat":"amor","text":"Hoy también cuenta, aunque solo hayas podido descansar."},{"cat":"amor","text":"Agradece lo que eres antes de exigirte lo que no eres."},{"cat":"amor","text":"No te disculpes por crecer."},{"cat":"amor","text":"Tu valor no sube ni baja con la opinión de otros."},{"cat":"amor","text":"Hay belleza en tu forma de intentarlo."},{"cat":"amor","text":"Date el abrazo que esperas de los demás."},{"cat":"amor","text":"Cuidarte no es egoísmo; es mantenimiento."},{"cat":"amor","text":"Cambiar la opinión que tienes de ti también es avanzar."},{"cat":"amor","text":"Escúchate antes de que tu cuerpo tenga que gritar."},{"cat":"amor","text":"Los días lentos también forman parte de tu historia."},{"cat":"amor","text":"No es tarde para empezar a tratarte mejor."},{"cat":"amor","text":"Tu forma de ser no necesita corregirse para merecer cariño."},{"cat":"amor","text":"Haz las paces con la persona del espejo."},{"cat":"amor","text":"Mereces una vida que no tengas que soportar, sino disfrutar."},{"cat":"amor","text":"Recuerda cuántas veces pensaste que no podrías, y pudiste."},{"cat":"amor","text":"Lo que te dices en voz baja también te construye."},{"cat":"amor","text":"No hace falta que nadie lo vea para que lo que haces valga."},{"cat":"amor","text":"La amistad es un alma que habita en dos cuerpos.","author":"Aristóteles"},{"cat":"amor","text":"Lo que no quieras para ti, no lo hagas a los demás.","author":"Confucio"},{"cat":"amor","text":"Quien conoce a los demás es sabio; quien se conoce a sí mismo está iluminado.","author":"Lao Tse"},{"cat":"amor","text":"Una vida sin examen no merece ser vivida.","author":"Sócrates"},{"cat":"amor","text":"¿Qué he avanzado? He empezado a ser amigo de mí mismo.","author":"Séneca"},{"cat":"disciplina","text":"La disciplina es un regalo que te haces a ti mismo cada día."},{"cat":"disciplina","text":"Puedes fallar un día. Procura no fallar dos seguidos."},{"cat":"disciplina","text":"Repetir lo sencillo es lo que vuelve extraordinario el resultado."},{"cat":"disciplina","text":"Las excusas son cómodas; los resultados, mejores."},{"cat":"disciplina","text":"Un poco cada día pesa más que mucho de vez en cuando."},{"cat":"disciplina","text":"Haz primero lo que menos te apetece."},{"cat":"disciplina","text":"Planea el día por la noche y defiéndelo por la mañana."},{"cat":"disciplina","text":"Las ganas son un invitado; la disciplina es la anfitriona."},{"cat":"disciplina","text":"Cumplirte las promesas pequeñas te enseña a confiar en ti."},{"cat":"disciplina","text":"No negocies cada mañana con tu pereza."},{"cat":"disciplina","text":"El esfuerzo silencioso hace ruido después."},{"cat":"disciplina","text":"Si no puedes hacerlo todo, haz cinco minutos."},{"cat":"disciplina","text":"La comodidad de hoy suele ser el problema de mañana."},{"cat":"disciplina","text":"Ordena tu entorno y tu mente le seguirá."},{"cat":"disciplina","text":"Elige el hábito, no el humor del día."},{"cat":"disciplina","text":"Ser constante es aburrido hasta que empieza a dar frutos."},{"cat":"disciplina","text":"Mide tu progreso en semanas, no en horas."},{"cat":"disciplina","text":"Termina lo que empiezas, aunque sea pequeño."},{"cat":"disciplina","text":"El talento abre la puerta; la disciplina te mantiene dentro."},{"cat":"disciplina","text":"Lo que repites acaba repitiéndote."},{"cat":"disciplina","text":"Hoy no hace falta motivación. Hace falta un horario."},{"cat":"disciplina","text":"No esperes al lunes. El martes también sirve."},{"cat":"disciplina","text":"La disciplina no es un castigo; es respeto por tus metas."},{"cat":"disciplina","text":"Haz que lo correcto sea lo fácil."},{"cat":"disciplina","text":"Una tarea a la vez, y con toda la atención."},{"cat":"disciplina","text":"Apaga el ruido y enciende el foco."},{"cat":"disciplina","text":"La rutina bien elegida te da libertad."},{"cat":"disciplina","text":"Hacer lo difícil primero aligera el resto del día."},{"cat":"disciplina","text":"No se trata de ser perfecto, sino de volver cada vez que te desvías."},{"cat":"disciplina","text":"El día que no te apetece es el día que más cuenta."},{"cat":"disciplina","text":"Gana la mañana y el día será más tuyo."},{"cat":"disciplina","text":"Lo que no tiene hora en tu agenda rara vez sucede."},{"cat":"disciplina","text":"Avanza aunque sea a medio gas."},{"cat":"disciplina","text":"La constancia convierte lo difícil en costumbre."},{"cat":"disciplina","text":"Prepara hoy el terreno que pisarás mañana."},{"cat":"disciplina","text":"Lo que haces cuando nadie te mira también te está construyendo."},{"cat":"disciplina","text":"Cuando dudes entre empezar o posponer, empieza."},{"cat":"disciplina","text":"Gota a gota se horada la piedra.","author":"Ovidio"},{"cat":"disciplina","text":"La primera y mejor de las victorias es vencerse a uno mismo.","author":"Platón"},{"cat":"disciplina","text":"Lo que hay que aprender a hacer, lo aprendemos haciéndolo.","author":"Aristóteles"},{"cat":"disciplina","text":"Exígete mucho a ti mismo y espera poco de los demás.","author":"Confucio"},{"cat":"disciplina","text":"Ninguna gran cosa se crea de repente.","author":"Epicteto"},{"cat":"disciplina","text":"Quien está en todas partes no está en ninguna.","author":"Séneca"},{"cat":"disciplina","text":"El carácter de una persona es su destino.","author":"Heráclito"},{"cat":"calma","text":"Inhala calma, exhala prisa."},{"cat":"calma","text":"No tienes que resolverlo todo esta noche."},{"cat":"calma","text":"Haz una cosa a la vez y hazla despacio."},{"cat":"calma","text":"El silencio también es una respuesta."},{"cat":"calma","text":"Deja pasar los pensamientos como pasan los coches por una calle."},{"cat":"calma","text":"Baja los hombros. Afloja la mandíbula. Respira."},{"cat":"calma","text":"Lo urgente rara vez es tan importante como parece."},{"cat":"calma","text":"Está bien no tener prisa."},{"cat":"calma","text":"Deja que hoy sea suficiente."},{"cat":"calma","text":"Mira por la ventana un minuto. El mundo sigue ahí."},{"cat":"calma","text":"No todos los pensamientos merecen tu atención."},{"cat":"calma","text":"Ir despacio te deja ver el camino."},{"cat":"calma","text":"Hay preguntas que se responden solas con el tiempo."},{"cat":"calma","text":"Descansa la mirada en algo que te guste."},{"cat":"calma","text":"El ruido de fuera baja cuando tú te calmas."},{"cat":"calma","text":"Lo que no puedes cambiar, puedes dejar de cargarlo."},{"cat":"calma","text":"Tu respiración siempre está ahí para traerte de vuelta."},{"cat":"calma","text":"Una taza caliente, una ventana y nada que demostrar."},{"cat":"calma","text":"La calma no espera a que todo esté en orden."},{"cat":"calma","text":"Hoy, menos. Pero mejor."},{"cat":"calma","text":"No tienes que contestar ahora."},{"cat":"calma","text":"Afloja la mano: no todo tiene que estar sujeto."},{"cat":"calma","text":"Cada respiración lenta es un pequeño regreso a ti."},{"cat":"calma","text":"No eres tus pensamientos; eres quien los observa."},{"cat":"calma","text":"Hacer una pausa también es decidir."},{"cat":"calma","text":"El presente es el único lugar donde puedes descansar."},{"cat":"calma","text":"Deja un espacio entre lo que pasa y lo que respondes."},{"cat":"calma","text":"Camina sin destino diez minutos. Tu cabeza te lo agradecerá."},{"cat":"calma","text":"El mar no se pelea con sus olas."},{"cat":"calma","text":"Las cosas importantes rara vez se hacen corriendo."},{"cat":"calma","text":"No hace falta llenar cada hueco del día."},{"cat":"calma","text":"Hoy, escucha más de lo que hablas."},{"cat":"calma","text":"Apaga una pantalla y enciende tu atención."},{"cat":"calma","text":"Mañana también será un día."},{"cat":"calma","text":"La tranquilidad se entrena como cualquier otra cosa."},{"cat":"calma","text":"Nadie florece a la fuerza."},{"cat":"calma","text":"En ningún lugar puede retirarse una persona con más tranquilidad que en su propia alma.","author":"Marco Aurelio"},{"cat":"calma","text":"Limítate al momento presente.","author":"Marco Aurelio"},{"cat":"calma","text":"Nadie se baña dos veces en el mismo río.","author":"Heráclito"},{"cat":"calma","text":"Nada en el mundo es más blando que el agua y, sin embargo, nada la supera ante lo duro.","author":"Lao Tse"},{"cat":"calma","text":"Quien sabe que tiene bastante es rico.","author":"Lao Tse"},{"cat":"calma","text":"Aprovecha el día y confía lo menos posible en el mañana.","author":"Horacio"},{"cat":"calma","text":"Todo lo que ha de venir es incierto: vive ya.","author":"Séneca"},{"cat":"calma","text":"La ira es una locura breve.","author":"Horacio"},{"cat":"exito","text":"Los resultados llegan tarde, pero llegan."},{"cat":"exito","text":"Prepárate para la oportunidad antes de que llame."},{"cat":"exito","text":"Aprende algo nuevo cada semana y en un año serás otra persona."},{"cat":"exito","text":"Rodéate de gente que te haga querer mejorar."},{"cat":"exito","text":"No busques atajos: busca el mejor camino."},{"cat":"exito","text":"Cada no te acerca un poco más a un sí."},{"cat":"exito","text":"Lo que aprendes nadie te lo puede quitar."},{"cat":"exito","text":"Haz bien tu trabajo aunque nadie lo aplauda."},{"cat":"exito","text":"El fracaso es información, no una sentencia."},{"cat":"exito","text":"Tu reputación se construye en cada detalle."},{"cat":"exito","text":"Celebra los avances, no solo las metas."},{"cat":"exito","text":"Pregunta más. Supón menos."},{"cat":"exito","text":"Equivócate pronto y aprende más pronto todavía."},{"cat":"exito","text":"Un buen hábito vale más que un gran propósito."},{"cat":"exito","text":"La curiosidad abre más puertas que la suerte."},{"cat":"exito","text":"Las ideas valen poco hasta que alguien las lleva a cabo."},{"cat":"exito","text":"Lo que hoy te parece un desvío puede ser el atajo."},{"cat":"exito","text":"El éxito que importa es el que te deja dormir tranquilo."},{"cat":"exito","text":"Define tu propio éxito antes de que otros lo hagan por ti."},{"cat":"exito","text":"Escuchar bien es una ventaja que pocos usan."},{"cat":"exito","text":"Pide ayuda: crecer solo es más lento."},{"cat":"exito","text":"La paciencia también es una estrategia."},{"cat":"exito","text":"Cada experto fue alguna vez un aprendiz con ganas."},{"cat":"exito","text":"Lo sencillo bien hecho siempre destaca."},{"cat":"exito","text":"Aprender es la inversión que más rinde."},{"cat":"exito","text":"El trabajo bien hecho es su propia firma."},{"cat":"exito","text":"Haz preguntas incómodas a tus propias ideas."},{"cat":"exito","text":"Ganar también es saber cuándo cambiar de rumbo."},{"cat":"exito","text":"Elige pocas cosas y hazlas muy bien."},{"cat":"exito","text":"Tu red no es a quién conoces, sino a quién ayudas."},{"cat":"exito","text":"Lo que cuidas, crece."},{"cat":"exito","text":"Detrás de cada logro hay mil intentos que no salen en la foto."},{"cat":"exito","text":"Si quieres llegar lejos, cuida la energía además del tiempo."},{"cat":"exito","text":"Los grandes cambios suelen empezar con una conversación honesta."},{"cat":"exito","text":"Aprende de quien va por delante y ayuda a quien viene detrás."},{"cat":"exito","text":"No hay viento favorable para quien no sabe a qué puerto se dirige.","author":"Séneca"},{"cat":"exito","text":"Una golondrina no hace verano, ni tampoco un solo día.","author":"Aristóteles"},{"cat":"exito","text":"Equivocarse y no corregirse: ese es el verdadero error.","author":"Confucio"},{"cat":"exito","text":"Aprender sin pensar es inútil; pensar sin aprender, peligroso.","author":"Confucio"},{"cat":"exito","text":"Cada uno es artífice de su ventura.","author":"Miguel de Cervantes"},{"cat":"exito","text":"El que lee mucho y anda mucho, ve mucho y sabe mucho.","author":"Miguel de Cervantes"},{"cat":"exito","text":"Lo bueno, si breve, dos veces bueno.","author":"Baltasar Gracián"},{"cat":"exito","text":"Escribe en tu corazón que cada día es el mejor del año.","author":"Ralph Waldo Emerson"},{"cat":"exito","text":"Mientras enseñamos, aprendemos.","author":"Séneca"},{"cat":"exito","text":"El árbol que apenas se abarca con los brazos nació de un brote diminuto.","author":"Lao Tse"},{"cat":"exito","text":"Es mala la decisión que no puede cambiarse.","author":"Publilio Siro"},{"cat":"estoicismo","text":"No pierdas más tiempo discutiendo cómo debe ser una buena persona. Sé una.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Se necesita muy poco para vivir una vida feliz.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"La mejor manera de vengarse es no parecerse a quien te hizo daño.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Por la mañana, cuando te cueste levantarte, piensa: me levanto para hacer el trabajo de un ser humano.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"El alma se tiñe del color de sus pensamientos.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Si no es correcto, no lo hagas; si no es verdad, no lo digas.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"A nadie le sucede nada que no esté hecho por naturaleza para soportar.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Mira hacia dentro: dentro está la fuente del bien.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"Haz cada acto de tu vida como si fuera el último.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No vivas como si fueras a vivir diez mil años.","author":"Marco Aurelio"},{"cat":"estoicismo","text":"No pidas que las cosas sucedan como quieres; quiere que sucedan como suceden, y vivirás en paz.","author":"Epicteto"},{"cat":"estoicismo","text":"Unas cosas dependen de nosotros y otras no.","author":"Epicteto"},{"cat":"estoicismo","text":"Es imposible aprender lo que uno cree que ya sabe.","author":"Epicteto"},{"cat":"estoicismo","text":"Son las dificultades las que muestran quiénes somos.","author":"Epicteto"},{"cat":"estoicismo","text":"Si quieres progresar, acepta parecer ignorante en las cosas externas.","author":"Epicteto"},{"cat":"estoicismo","text":"Tenemos dos orejas y una sola boca para escuchar más y hablar menos.","author":"Zenón de Citio"},{"cat":"estoicismo","text":"La vida, si sabes usarla, es larga.","author":"Séneca"},{"cat":"estoicismo","text":"Apresúrate a vivir bien y piensa que cada día es una vida entera.","author":"Séneca"},{"cat":"estoicismo","text":"No es pobre quien tiene poco, sino quien desea más.","author":"Séneca"},{"cat":"estoicismo","text":"A veces, incluso vivir es un acto de valentía.","author":"Séneca"},{"cat":"estoicismo","text":"Hay que aprender a vivir durante toda la vida.","author":"Séneca"},{"cat":"estoicismo","text":"El camino de los preceptos es largo; el de los ejemplos, breve y eficaz.","author":"Séneca"},{"cat":"estoicismo","text":"Distingue lo que puedes cambiar de lo que solo puedes aceptar."},{"cat":"estoicismo","text":"Tu respuesta es lo único que siempre te pertenece."},{"cat":"estoicismo","text":"Que no te pese el juicio de quien no conoce tu camino."},{"ca /* ---------- Lógica de frases (igual que QuoteStore.swift) ---------- */
function weightsOf(p) {
  const r = {};
  const add = w => { for (const k in w) r[k] = (r[k] || 0) + w[k]; };
  const f = FOCUS.find(x => x.id === p.focus); if (f) add(f.w);
  const a = AREAS.find(x => x.id === p.area); if (a) add(a.w);
  (p.obstacles || []).forEach(id => { const o = OBSTACLES.find(x => x.id === id); if (o) add(o.w); });
  return r;
}
const matchesStyle = (p, q) => p.style === 'originales' ? !q.author : p.style === 'clasicos' ? !!q.author : true;
function personalized(p) {
  const w = weightsOf(p);
  if (!Object.keys(w).length) return QUOTES.filter(q => matchesStyle(p, q));
  const byCat = QUOTES.filter(q => (w[q.cat] || 0) > 0);
  const styled = byCat.filter(q => matchesStyle(p, q));
  return styled.length >= 12 ? styled : byCat;
}
function pool(cat) {
  if (cat === 'parati') return personalized(S.profile);
  if (cat === 'general') return QUOTES.slice();
  if (cat === 'favoritas') return QUOTES.filter(q => S.favs.includes(q.id));
  return QUOTES.filter(q => q.cat === cat);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ordered(list, cat) {
  const w = weightsOf(S.profile);
  if (cat !== 'parati' || !Object.keys(w).length) return shuffle(list);
  // Muestreo ponderado sin reemplazo: clave = u^(1/peso)
  return list.map(q => [q, Math.pow(Math.random() || 1e-9, 1 / Math.max(w[q.cat] || .5, .1))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
// Frase del día determinista (SplitMix64), la misma que la app nativa y el widget.
function quoteOfTheDay(d = new Date()) {
  const M = (1n << 64n) - 1n;
  let x = (BigInt(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate()) + 0x9E3779B97F4A7C15n) & M;
  x = ((x ^ (x >> 30n)) * 0xBF58476D1CE4E5B9n) & M;
  x = ((x ^ (x >> 27n)) * 0x94D049BB133111EBn) & M;
  x ^= x >> 31n;
  return QUOTES[Number(x % BigInt(QUOTES.length))];
}
function topCats(p, n) {
  const w = weightsOf(p);
  return Object.keys(w).sort((a, b) => w[b] - w[a] || a.localeCompare(b)).slice(0, n);
}

function applyTheme() {
  const t = themeById(S.theme), app = $('#app'), [r, g, b] = hexRgb(t.text);
  $('#bg').style.background = t.bg;
  $('#scrim').style.opacity = t.scrim;
  app.classList.toggle('light', !!t.light);
  app.classList.toggle('large-author', !!t.large);
  app.style.setProperty('--bgfull', `linear-gradient(rgba(0,0,0,${t.scrim}),rgba(0,0,0,${t.scrim})),${t.bg}`);
  app.style.setProperty('--text', t.text);
  app.style.setProperty('--sub', `rgba(${r},${g},${b},${t.light ? .78 : .8})`);
  app.style.setProperty('--author', t.author);
  app.style.setProperty('--shadow', t.light ? .06 : .25);
  app.style.setProperty('--on-text', t.light ? '#ffffff' : '#1c2026');
  document.querySelector('meta[name=theme-color]').content = t.bg.match(/#[0-9a-f]{6}/i)[0];
}

/* ---------- Racha ---------- */
function registerOpen() {
  const today = new Date();
  if (S.lastDay) {
    const diff = daysBetween(new Date(S.lastDay), today);
    if (diff <= 0) { S.streak = Math.max(S.streak, 1); save(); return; }
    S.streak = diff === 1 ? S.streak + 1 : 1;
  } else S.streak = 1;
  S.lastDay = startOfDay(today).toISOString();
  save();
}
const renderStreak = () => {
  $('#streak').innerHTML = `${ico('flame')}<span>${S.streak} ${S.streak === 1 ? 'día' : 'días'}</span>`;
  $('#streak').setAttribute('aria-label', `Racha: ${S.streak} ${S.streak === 1 ? 'día' : 'días'}`);
};

/* ---------- Feed ---------- */
const feedEl = $('#feed');
let items = [], nextId = 0;

function rebuildFeed() {
  items = [];
  let p = pool(S.cat);
  if (p.length) {
    if (S.cat === 'general' || S.cat === 'parati') {
      const today = quoteOfTheDay();
      items.push({ id: nextId++, kind: 'quote', q: today, qotd: true });
      p = p.filter(q => q.id !== today.id);
    }
    if (S.cat === 'parati' && S.profile.goal.trim()) items.push({ id: nextId++, kind: 'goal' });
    ordered(p, S.cat).forEach(q => items.push({ id: nextId++, kind: 'quote', q }));
  }
  feedEl.innerHTML = '';
  if (!items.length) feedEl.appendChild(emptyCard());
  else items.forEach(it => feedEl.appendChild(renderItem(it)));
  feedEl.scrollTop = 0;
  renderBars();
}

function loadMore() {
  let batch = ordered(pool(S.cat), S.cat);
  if (batch.length < 2) return;
  const last = [...items].reverse().find(i => i.q);
  if (last && batch[0].id === last.q.id) { const j = 1 + Math.floor(Math.random() * (batch.length - 1)); [batch[0], batch[j]] = [batch[j], batch[0]]; }
  batch.forEach(q => { const it = { id: nextId++, kind: 'quote', q }; items.push(it); feedEl.appendChild(renderItem(it)); });
}

const fontSize = t => t.length <= 48 ? 34 : t.length <= 80 ? 30 : 26;

function renderItem(it) {
  if (it.kind === 'goal') return goalCard();
  const q = it.q, fav = S.favs.includes(q.id), first = it === items[0];
  const name = S.profile.name.trim();
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `
    <div class="qwrap" role="group" aria-label="${esc(q.text)}${q.author ? ', ' + esc(q.author) : ''}">
      ${it.qotd ? `<div class="label">${name ? 'Tu frase de hoy, ' + esc(name) : 'Frase del día'}</div>` : ''}
      <p class="quote" style="font-size:${fontSize(q.text)}px">${esc(q.text)}</p>
      ${q.author ? `<p class="author">${esc(q.author)}</p>` : ''}
    </div>
    <div class="actions">
      <button class="cbtn glass press" data-act="share" aria-label="Compartir frase">${ico('share')}</button>
      <button class="cbtn glass press ${fav ? 'on' : ''}" data-act="like" data-qid="${q.id}" aria-label="${fav ? 'Quitar de favoritas' : 'Guardar en favoritas'}">${ico('heart')}</button>
    </div>
    ${it.qotd && !S.widgetGuideSeen ? `<button class="suggest glass press" data-act="widget">${ico('lock')}Ponla en tu pantalla de bloqueo</button>` : ''}
    <div class="bigheart" aria-hidden="true"><svg viewBox="0 0 24 24">${P.heart}</svg></div>
    ${first && !S.seenHint ? `<div class="hint" aria-hidden="true">${ico('chevup')}Desliza hacia arriba</div>` : ''}`;
  el.querySelector('[data-act=share]').onclick = () => share(q);
  el.querySelector('[data-act=like]').onclick = () => toggleFav(q);
  const w = el.querySelector('[data-act=widget]'); if (w) w.onclick = () => openWidgetGuide('lock');
  // Doble toque = guardar en favoritas
  let lastTap = 0;
  el.querySelector('.qwrap').addEventListener('pointerup', e => {
    const now = Date.now();
    if (now - lastTap < 320) { saveFav(q); const h = el.querySelector('.bigheart'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go'); lastTap = 0; }
    else lastTap = now;
  });
  return el;
}

function goalCard() {
  const p = S.profile, done = S.progressDays.includes(dayKey(new Date()));
  const day = p.goalStart ? Math.max(daysBetween(new Date(p.goalStart), new Date()), 0) + 1 : 1;
  const hz = HORIZONS.find(h => h.id === p.horizon);
  const area = AREAS.find(a => a.id === p.area);
  const n = S.progressDays.length;
  const el = document.createElement('section');
  el.className = 'card';
  el.innerHTML = `
    <div class="qwrap" style="gap:18px">
      <div class="label" style="display:flex;gap:6px;align-items:center">${ico(area ? area.icon : 'target').replace('class="i"', 'class="i" style="width:15px;height:15px"')}Tu objetivo</div>
      <p class="goal-title">${esc(p.goal.trim())}</p>
      <div class="chips">
        <span class="chip glass">Día ${day}</span>
        ${p.horizon !== 'sinFecha' ? `<span class="chip glass">${hz.title}</span>` : ''}
        ${n ? `<span class="chip glass">${n} ${n === 1 ? 'día avanzando' : 'días avanzando'}</span>` : ''}
      </div>
      <p class="goal-q">${done ? 'Hoy ya has dado un paso. Mañana, otro.' : '¿Qué pequeño paso puedes dar hoy?'}</p>
    </div>
    <button class="progress-btn glass press ${done ? 'on' : ''}" aria-pressed="${done}">${ico(done ? 'checkc' : 'circle')}${done ? 'Hoy he avanzado' : 'Marcar que hoy he avanzado'}</button>
    <button class="linkbtn">Cambiar objetivo</button>`;
  el.querySelector('.progress-btn').onclick = () => {
    const k = dayKey(new Date());
    if (S.progressDays.includes(k)) S.progressDays = S.progressDays.filter(x => x !== k);
    else { S.progressDays.push(k); toast('¡Un paso más hacia tu objetivo!'); }
    save(); el.replaceWith(goalCard());
  };
  el.querySelector('.linkbtn').onclick = () => openOnboarding();
  return el;
}

function emptyCard() {
  const el = document.createElement('section');
  el.className = 'card empty';
  el.innerHTML = `${ico('heart').replace('class="i"', 'class="i" style="width:34px;height:34px;color:var(--sub)"')}
    <h2>Aún no tienes favoritas</h2>
    <p>Toca el corazón o haz doble toque sobre una frase para guardarla aquí.</p>
    <button class="glass press">Ver todas las frases</button>`;
  el.querySelector('button').onclick = () => selectCat('general');
  return el;
}

feedEl.addEventListener('scroll', () => {
  const idx = Math.round(feedEl.scrollTop / feedEl.clientHeight);
  if (idx > 0 && !S.seenHint) { S.seenHint = true; save(); feedEl.querySelectorAll('.hint').forEach(h => { h.style.opacity = 0; setTimeout(() => h.remove(), 300); }); }
  if (items.length && idx >= items.length - 3) loadMore();
}, { passive: true });

/* ---------- Acciones ---------- */
function selectCat(id) { S.cat = id; save(); rebuildFeed(); }

function refreshLikes(qid) {
  const fav = S.favs.includes(qid);
  feedEl.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => { b.classList.toggle('on', fav); b.setAttribute('aria-label', fav ? 'Quitar de favoritas' : 'Guardar en favoritas'); });
}
function toggleFav(q) {
  if (S.favs.includes(q.id)) { S.favs = S.favs.filter(x => x !== q.id); toast('Quitada de favoritas'); }
  else { S.favs.push(q.id); toast('Guardada en favoritas'); }
  save(); refreshLikes(q.id);
}
function saveFav(q) {
  if (S.favs.includes(q.id)) return;
  S.favs.push(q.id); save(); refreshLikes(q.id); toast('Guardada en favoritas');
}

async function share(q) {
  const text = `“${q.text}”${q.author ? ' — ' + q.author : ''}\n\nVía Impulso`;
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Frase copiada para compartir'); }
  catch { toast('No se ha podido compartir'); }
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

function renderBars() {
  $('#catBtn').innerHTML = `${ico('grid')}<span>${catName(S.cat)}</span>`;
  $('#favBtn').innerHTML = ico('bookmark');
  $('#favBtn').classList.toggle('on', S.cat === 'favoritas');
  $('#themeBtn').innerHTML = ico('brush');
  $('#bellBtn').innerHTML = ico('bell');
}

/* ---------- Hojas ---------- */
function openSheet(build, tall = false) {
  const host = $('#sheets');
  host.innerHTML = `<div class="overlay"></div><div class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true"><div class="grabber"></div><div class="sheet-body"></div></div>`;
  const ov = host.querySelector('.overlay'), sh = host.querySelector('.sheet');
  build(host.querySelector('.sheet-body'));
  requestAnimationFrame(() => { ov.classList.add('show'); sh.classList.add('show'); });
  ov.onclick = closeSheet;
  // Arrastrar el tirador hacia abajo cierra la hoja
  let y0 = null;
  const grab = host.querySelector('.grabber');
  sh.addEventListener('touchstart', e => { if (e.target === grab || sh.querySelector('.sheet-body').scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 !== null) { const dy = e.touches[0].clientY - y0; if (dy > 0) sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener('touchend', e => { if (y0 === null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null; sh.style.transform = ''; if (dy > 90) closeSheet(); });
}
function closeSheet() {
  const host = $('#sheets'), ov = host.querySelector('.overlay'), sh = host.querySelector('.sheet');
  if (!sh) return;
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(() => { host.innerHTML = ''; }, 380);
}

function categorySheet(body) {
  const count = id => pool(id).length;
  body.innerHTML = `<h2 class="sh-title">Categorías</h2><p class="sh-sub">Elige qué tipo de frases quieres ver.</p>
    <div class="grid2">${CATS.map(c => `<button class="cat press ${c.id === S.cat ? 'on' : ''}" data-id="${c.id}" aria-pressed="${c.id === S.cat}">
      <b>${c.name}</b><span>${c.blurb}</span><small>${count(c.id)} ${count(c.id) === 1 ? 'frase' : 'frases'}</small></button>`).join('')}</div>
    <button class="redo press">${ico('redo')}Volver a responder las preguntas</button>
    <p class="note">Así «Para ti» se ajusta a tu momento y a tu objetivo actual.</p>`;
  body.querySelectorAll('.cat').forEach(b => b.onclick = () => { selectCat(b.dataset.id); closeSheet(); });
  body.querySelector('.redo').onclick = () => { closeSheet(); setTimeout(openOnboarding, 380); };
}

function themeSheet(body) {
  body.innerHTML = `<h2 class="sh-title">Temas</h2><p class="sh-sub">Cambia el fondo y el ambiente de tus frases.</p>
    <div class="grid3">${THEMES.map(t => thumb(t, '#1c2026')).join('')}</div>`;
  body.querySelectorAll('.thumb').forEach(b => b.onclick = () => {
    S.theme = b.dataset.id; save(); applyTheme();
    body.querySelectorAll('.thumb').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
  });
}
const thumb = (t, labelColor, h = 150) => `<button class="thumb press ${t.id === S.theme ? 'on' : ''}" data-id="${t.id}" aria-pressed="${t.id === S.theme}" style="color:${labelColor}">
  <div class="sw" style="background:${t.bg};height:${h}px"><div style="position:absolute;inset:0;background:#000;opacity:${t.scrim}"></div><span style="color:${t.text}">Aa</span></div>${t.name}</button>`;

function bellSheet(body) {
  const times = listY((S.profile.moments || []).map(id => MOMENTS.find(m => m.id === id).time));
  body.innerHTML = `<h2 class="sh-title">Recordatorios y widgets</h2>
    <p class="sh-sub">En la app de iPhone recibirás frases a las horas que elijas${times ? ` (tú elegiste: ${times})` : ''} y podrás ver la frase del día en la pantalla de bloqueo.</p>
    <p class="section-h">Widgets</p>
    <button class="row press" data-p="lock">${ico('lock')}Frase del día en la pantalla de bloqueo<span class="chev">›</span></button>
    <button class="row press" data-p="home">${ico('phone')}Widget en la pantalla de inicio<span class="chev">›</span></button>
    <p class="note" style="text-align:left">Esta es una versión web de prueba: las notificaciones y los widgets solo funcionan en la app nativa de iPhone.</p>`;
  body.querySelectorAll('.row').forEach(b => b.onclick = () => { closeSheet(); setTimeout(() => openWidgetGuide(b.dataset.p), 380); });
}

const STEPS = {
  lock: ['Con el iPhone bloqueado, mantén pulsada la pantalla de bloqueo hasta que aparezca «Personalizar».', 'Toca «Personalizar» y elige «Pantalla de bloqueo».', 'Toca el recuadro de widgets que hay debajo de la hora.', 'Busca «Impulso» y toca el widget «Frase del día».', 'Toca «OK». A partir de ahora la verás cada vez que enciendas el móvil.'],
  home: ['Mantén pulsado un espacio vacío de la pantalla de inicio hasta que los iconos se muevan.', 'Toca «Editar» o «+» en la esquina superior izquierda y elige «Añadir widget».', 'Busca «Impulso».', 'Elige el tamaño que prefieras (pequeño, mediano o grande) y toca «Añadir widget».', 'Colócalo donde quieras y toca «OK».'],
};
function phonePreview(place) {
  const q = quoteOfTheDay(), now = new Date(), t = themeById(S.theme);
  const date = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  const time = now.toLocaleTimeString('es-ES', { hour: 'numeric', minute: '2-digit' });
  if (place === 'lock') return `<div class="phone" role="img" aria-label="Vista previa: la frase del día en la pantalla de bloqueo, debajo de la hora"><div class="island"></div>
    <div class="date">${date}</div><div class="time">${time}</div><div class="lw">${esc(q.text)}${q.author ? `<small>${esc(q.author)}</small>` : ''}</div></div>`;
  return `<div class="phone" role="img" aria-label="Vista previa: la frase del día como widget en la pantalla de inicio"><div class="island"></div>
    <div class="hw" style="background:${t.bg};color:${t.text}"><div style="position:absolute;inset:0;background:#000;opacity:${t.scrim}"></div><p>${esc(q.text)}</p></div>
    <div class="icons">${'<i></i>'.repeat(12)}</div></div>`;
}
function openWidgetGuide(place = 'lock', onClose) {
  S.widgetGuideSeen = true; save();
  feedEl.querySelectorAll('.suggest').forEach(b => b.remove());
  openSheet(body => {
    const draw = () => {
      body.innerHTML = `<h2 class="sh-title">Tu frase del día, siempre a la vista</h2>
        <p class="sh-sub">Mírala nada más encender el móvil, sin abrir la app.</p>
        <div class="seg" role="tablist">
          <button role="tab" class="${place === 'lock' ? 'on' : ''}" data-p="lock" aria-selected="${place === 'lock'}">Pantalla de bloqueo</button>
          <button role="tab" class="${place === 'home' ? 'on' : ''}" data-p="home" aria-selected="${place === 'home'}">Pantalla de inicio</button>
        </div>
        ${phonePreview(place)}
        <p class="section-h" style="color:var(--sheet-text);text-transform:none;letter-spacing:0;font-size:18px;font-weight:700">Cómo añadirlo</p>
        <ol class="steps">${STEPS[place].map((s, i) => `<li><i>${i + 1}</i><span>${s}</span></li>`).join('')}</ol>
        <p class="note" style="text-align:left;margin-top:18px">iOS no deja que las apps añadan widgets por sí solas, así que solo hay que hacerlo a mano una vez. La frase cambia sola cada día. <b>En esta versión web de prueba no hay widget:</b> estará en la app de iPhone.</p>
        <button class="darkbtn press">Entendido</button>`;
      body.querySelectorAll('.seg button').forEach(b => b.onclick = () => { place = b.dataset.p; draw(); });
      body.querySelector('.darkbtn').onclick = () => { closeSheet(); if (onClose) setTimeout(onClose, 380); };

    draw();

}

$('#catBtn').onclick = () => openSheet(categorySheet);
$('#themeBtn').onclick = () => openSheet(themeSheet);
$('#favBtn').onclick = () => selectCat('favoritas');
$('#bellBtn').onclick = () => openSheet(bellSheet);

/* ---------- Cuestionario de bienvenida ---------- */
const STEP_LIST = ['welcome', 'name', 'focus', 'area', 'goal', 'obstacles', 'style', 'moments', 'theme', 'widget', 'summary'];
let draft, step, forward = true;

function openOnboarding() {
  draft = structuredClone(S.profile);
  step = 'welcome';
  $('#onb').classList.remove('hide');
  renderOnb();
}
function closeOnboarding() { $('#onb').classList.add('hide'); setTimeout(() => { $('#onb').innerHTML = ''; }, 350); }

function go(delta) {
  const i = STEP_LIST.indexOf(step) + delta;
  if (i >= STEP_LIST.length) return finishOnboarding();
  if (i < 0) return;
  forward = delta > 0; step = STEP_LIST[i]; renderOnb();
}

function opt({ title, sub, icon, on, multi }) {
  return `<button class="opt glass press ${on ? 'on' : ''} ${multi ? 'multi' : ''}" aria-pressed="${!!on}">
    ${icon ? `<span class="ic">${ico(icon)}</span>` : ''}
    <span class="tx"><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</span>
    <span class="mk">${ico('check')}</span></button>`;
}

function renderOnb() {
  const onb = $('#onb'), i = STEP_LIST.indexOf(step), t = themeById(S.theme);
  const name = draft.name.trim();
  let body = '', foot = '', after = null;
  const head = (title, sub) => `<h1 class="q-title">${title}</h1>${sub ? `<p class="q-sub">${sub}</p>` : ''}`;

  switch (step) {
    case 'welcome':
      body = `<div class="welcome"><div class="big" aria-label="Impulso">impulso</div>
        <div class="lead">Motivación para cada día y para llegar a donde quieres.</div>
        <p>Responde unas preguntas rápidas y Impulso elegirá las frases, los recordatorios y el seguimiento de tu objetivo que mejor encajan contigo.</p>
        <small>${ico('lock')}Tus respuestas se quedan en tu móvil.</small></div>`;
      foot = `<button class="primary press" data-a="next">Empezar</button><button class="secondary" data-a="finish">Ahora no</button>`;
      break;
    case 'name':
      body = head('¿Cómo te llamas?', 'Lo usaremos para hablarte de tú a tú.') +
        `<input class="field glass" id="nameIn" type="text" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" placeholder="Tu nombre" aria-label="Nombre" maxlength="30" value="${esc(draft.name)}">`;
      foot = `<button class="primary press" data-a="next">Continuar</button><button class="secondary" data-a="skip">Omitir</button>`;
      after = () => { const inp = $('#nameIn'); inp.oninput = () => draft.name = inp.value; inp.onkeydown = e => { if (e.key === 'Enter') go(1); }; };
      break;
    case 'focus':
      body = head(name ? `${esc(name)}, ¿qué quieres conseguir con Impulso?` : '¿Qué quieres conseguir con Impulso?', 'Elige lo que más te importa ahora mismo.') +
        `<div class="opts">${FOCUS.map(f => opt({ title: f.title, sub: f.sub, icon: f.icon, on: draft.focus === f.id })).join('')}</div>`;
      foot = `<button class="primary press" data-a="next" ${draft.focus ? '' : 'disabled'}>Continuar</button>`;
      after = () => onb.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => { draft.focus = FOCUS[k].id; renderOnb(true); });
      break;
    case 'area':
      body = head('¿En qué parte de tu vida quieres avanzar?', 'Elige la que más te importe ahora. Podrás cambiarla cuando quieras.') +
        `<div class="opts">${AREAS.map(a => opt({ title: a.title, icon: a.icon, on: draft.area === a.id })).join('')}</div>`;
      foot = `<button class="primary press" data-a="next" ${draft.area ? '' : 'disabled'}>Continuar</button>`;
      after = () => onb.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => { draft.area = AREAS[k].id; renderOnb(true); });
      break;
    case 'goal': {
      const area = AREAS.find(a => a.id === draft.area);
      body = head('¿Cuál es tu objetivo?', 'Escríbelo en una frase. Te lo recordaremos cada día para que no lo pierdas de vista.') +
        `<textarea class="field glass" id="goalIn" rows="3" maxlength="140" enterkeyhint="done" aria-label="Objetivo" placeholder="${esc(area ? area.ex : 'Ej.: terminar mi primer proyecto')}">${esc(draft.goal)}</textarea>
        <p style="font-size:16px;font-weight:600;margin-top:22px">¿Para cuándo?</p>
        <div class="hz">${HORIZONS.map(h => `<button class="glass press ${draft.horizon === h.id ? 'on' : ''}" data-h="${h.id}" aria-pressed="${draft.horizon === h.id}">${h.title}</button>`).join('')}</div>`;
      foot = `<button class="primary press" data-a="next">Continuar</button><button class="secondary" data-a="skip">Omitir</button>`;
      after = () => {
        const g = $('#goalIn'); g.oninput = () => draft.goal = g.value;
        onb.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { draft.horizon = b.dataset.h; onb.querySelectorAll('[data-h]').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); });
      };
      break;
    }
    case 'obstacles':
      body = head('¿Qué te frena más a menudo?', 'Elige todas las que quieras. Así sabremos qué frases te ayudan más.') +
        `<div class="opts">${OBSTACLES.map(o => opt({ title: o.title, on: draft.obstacles.includes(o.id), multi: true })).join('')}</div>`;
      foot = `<button class="primary press" data-a="next">Continuar</button><button class="secondary" data-a="skip">Omitir</button>`;
      after = () => onb.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => {
        const id = OBSTACLES[k].id; draft.obstacles = draft.obstacles.includes(id) ? draft.obstacles.filter(x => x !== id) : [...draft.obstacles, id]; renderOnb(true);
      });
      break;
    case 'style':
      body = head('¿Qué frases te llegan más?') +
        `<div class="opts">${STYLES.map(s => opt({ title: s.title, sub: s.sub, on: draft.style === s.id })).join('')}</div>`;
      foot = `<button class="primary press" data-a="next">Continuar</button>`;
      after = () => onb.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => { draft.style = STYLES[k].id; renderOnb(true); });
      break;
    case 'moments':
      body = head('¿Cuándo te vendría bien un impulso?', 'En la app de iPhone te enviaremos una frase en esos momentos. Si no quieres avisos, no marques ninguno.') +
        `<div class="opts">${MOMENTS.map(m => opt({ title: m.title, sub: m.time, icon: m.icon, on: draft.moments.includes(m.id), multi: true })).join('')}</div>`;
      foot = `<button class="primary press" data-a="next">Continuar</button>`;
      after = () => onb.querySelectorAll('.opt').forEach((b, k) => b.onclick = () => {
        const id = MOMENTS[k].id; draft.moments = draft.moments.includes(id) ? draft.moments.filter(x => x !== id) : [...draft.moments, id]; renderOnb(true);
      });
      break;
    case 'theme':
      body = head('Elige tu ambiente', 'Así se verán tus frases. Puedes cambiarlo más tarde con el pincel.') +
        `<div class="grid3">${THEMES.map(x => thumb(x, t.text, 120)).join('')}</div>`;
      foot = `<button class="primary press" data-a="next">Continuar</button>`;
      after = () => onb.querySelectorAll('.thumb').forEach(b => b.onclick = () => { S.theme = b.dataset.id; save(); applyTheme(); renderOnb(true); });
      break;
    case 'widget':
      body = head('Tu frase del día, al encender el móvil', 'Pon Impulso en tu pantalla de bloqueo y verás la frase del día debajo de la hora, sin abrir la app. También puedes ponerla en la pantalla de inicio.') +
        phonePreview('lock') + `<p class="webnote">Tardas unos 30 segundos y solo hay que hacerlo una vez.</p>`;
      foot = `<button class="primary press" data-a="guide">Enséñame cómo</button><button class="secondary" data-a="next">Más tarde</button>`;
      break;
    case 'summary': {
      const cats = topCats(draft, 3).map(catName);
      const times = listY(MOMENTS.filter(m => draft.moments.includes(m.id)).map(m => m.time));
      const area = AREAS.find(a => a.id === draft.area);
      const hz = HORIZONS.find(h => h.id === draft.horizon);
      const goal = draft.goal.trim();
      const card = (icon, title, text) => `<div class="sum glass">${ico(icon)}<div><small>${title}</small><p>${text}</p></div></div>`;
      body = `<div style="padding-top:20px">${ico('sparkles').replace('class="i"', 'class="i" style="width:40px;height:40px;stroke-width:1.2"')}
        <h1 class="q-title" style="margin-top:14px;font-size:40px">${name ? 'Todo listo, ' + esc(name) : 'Todo listo'}</h1>
        <p class="q-sub" style="margin-bottom:8px">Esto es lo que hemos preparado para ti:</p>
        ${goal ? card(area ? area.icon : 'target', 'Tu objetivo', esc(goal) + (draft.horizon !== 'sinFecha' ? ' · ' + hz.title : '')) : ''}
        ${card('grid', 'Tus frases', cats.length ? `«Para ti» se centrará en ${listY(cats)}.` : '«Para ti» te mostrará un poco de todo.')}
        ${times ? card('bell', 'Tus recordatorios', `Cada día a las ${times} (en la app de iPhone).`) : ''}
        ${goal ? card('checkc', 'Tu seguimiento', 'Cada día podrás marcar que has avanzado hacia tu objetivo.') : ''}</div>`;
      foot = `<button class="primary press" data-a="finish">Ver mis frases</button>`;
      break;
    }
  }

  const keepScroll = arguments[0] === true;
  const prevScroll = keepScroll && onb.querySelector('.onb-body') ? onb.querySelector('.onb-body').scrollTop : 0;
  onb.innerHTML = `
    <div class="onb-head">
      <button class="back glass press" aria-label="Atrás" style="visibility:${i > 0 ? 'visible' : 'hidden'}">${ico('back')}</button>
      <div class="bar" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="${STEP_LIST.length - 1}" aria-valuenow="${i}" style="visibility:${i > 0 ? 'visible' : 'hidden'}"><i style="width:${(i / (STEP_LIST.length - 1)) * 100}%"></i></div>
      <span style="width:40px"></span>
    </div>
    <div class="onb-body ${keepScroll || reduceMotion ? '' : (forward ? 'enter' : 'enter-back')}">${body}</div>
    <div class="onb-foot">${foot}</div>`;
  onb.querySelector('.onb-body').scrollTop = prevScroll;
  onb.querySelector('.back').onclick = () => go(-1);
  onb.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === 'next') go(1);
    else if (a === 'finish') finishOnboarding();
    else if (a === 'guide') openWidgetGuide('lock', () => go(1));
    else if (a === 'skip') {
      if (step === 'name') draft.name = '';
      if (step === 'goal') { draft.goal = ''; draft.horizon = 'sinFecha'; }
      if (step === 'obstacles') draft.obstacles = [];
      go(1);
    }
  });
  if (after) after();
  if (step === 'name' && !keepScroll) setTimeout(() => { const n = $('#nameIn'); if (n) n.focus(); }, 350);
}

function finishOnboarding() {
  const p = draft;
  p.name = p.name.trim().slice(0, 30);
  p.goal = p.goal.trim().slice(0, 140);
  if (p.goal !== (S.profile.goal || '').trim()) { p.goalStart = p.goal ? startOfDay(new Date()).toISOString() : null; S.progressDays = []; }
  else if (p.goal && !p.goalStart) p.goalStart = startOfDay(new Date()).toISOString();
  S.profile = p; S.onboardingDone = true; S.cat = 'parati'; save();
  closeOnboarding(); rebuildFeed();
}

/* ---------- Arranque ---------- */
applyTheme();
registerOpen();
renderStreak();
rebuildFeed();
if (!S.onboardingDone) openOnboarding();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { registerOpen(); renderStreak(); } });
</script>
</body>
</html>
